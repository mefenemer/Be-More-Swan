# Drives the staging outbound lead-discovery pipeline.
#
# Why this exists: Netlify runs scheduled functions ONLY on the production deploy —
# never on branch/preview deploys. Staging (https://staging--bemoreswan.netlify.app)
# is a branch deploy of the `staging` branch, so its `dispatch-discovery-runs` and
# `process-discovery-jobs` crons never fire there. This workflow pokes the SAME logic
# over HTTP via run-discovery-jobs (which runs dispatch + drain) so the discovery queue
# advances on staging the same way the native crons advance it on production.
# Design: docs/lead-generator-discovery-plan.md.
#
# NOTES / LIMITATIONS (identical to staging-content-cron.yml):
#  * GitHub Actions `schedule` only runs from the DEFAULT branch (main), ~5-min granularity.
#  * Scheduled workflows only start firing once this file is on `main`.
#  * Production is unaffected — this only talks to the staging URL.
#
# REQUIRED SETUP (reuses the SAME secret as the content drainer):
#  1. GitHub  → repo Settings → Secrets and variables → Actions → CRON_TRIGGER_SECRET
#  2. Netlify → site → Environment variables → CRON_TRIGGER_SECRET (staging/branch-deploy scope)
#  3. Netlify → SERPER_API_KEY (else runs complete but discover nothing).
# The wrapper endpoint (run-discovery-jobs) FAILS CLOSED — 503 until the secret is set.

name: Staging discovery-job drainer

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub Actions minimum)
  workflow_dispatch: {}       # allow manual "Run workflow" from the Actions tab

# If a previous run is still going, don't pile up.
concurrency:
  group: staging-discovery-cron
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: POST to staging run-discovery-jobs
        env:
          ENDPOINT: "https://staging--bemoreswan.netlify.app/.netlify/functions/run-discovery-jobs"
          CRON_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repo secret CRON_TRIGGER_SECRET is not set — the endpoint will reject the call (401/503)."
            exit 1
          fi
          echo "POST $ENDPOINT"
          HTTP_CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            --max-time 120 --retry 2 --retry-delay 5 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$ENDPOINT")
          echo "HTTP $HTTP_CODE"
          echo "----- response body -----"
          cat /tmp/body.txt || true
          echo
          echo "-------------------------"
          case "$HTTP_CODE" in
            2*) echo "OK" ;;
            *)  echo "::error::Worker returned HTTP $HTTP_CODE"; exit 1 ;;
          esac
