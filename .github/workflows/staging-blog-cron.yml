# Drives Blog Autopilot on staging.
#
# Why this exists: Netlify runs scheduled functions ONLY on the production deploy —
# never on branch/preview deploys. Staging (https://staging--bemoreswan.netlify.app)
# is a branch deploy of the `staging` branch, so neither `blog-horizon-fill` nor
# `process-blog-jobs` ever fires there and Blog Autopilot would look entirely dead
# on staging even when it works in production.
#
# The wrapper endpoint runs BOTH halves in one call — horizon-fill, then the drain —
# so a slot enqueued on a tick is drafted on that same tick.
#
# This mirrors staging-content-cron.yml; see that file for the shared rationale.
# NOTE: deleting these staging-*-cron.yml workflows silently kills staging's crons —
# they are NOT redundant with the netlify.toml schedules.
#
# NOTES / LIMITATIONS:
#  * GitHub Actions `schedule` only runs from the DEFAULT branch (main) and has a ~5-min
#    minimum granularity (and can be delayed under load). That's fine for a test env.
#  * Scheduled workflows only start firing once this file is on `main`.
#  * Production is unaffected — this only talks to the staging URL.
#
# REQUIRED SETUP: reuses the SAME CRON_TRIGGER_SECRET as staging-content-cron.yml
# (GitHub repo secret + Netlify env var, scoped to the branch-deploy context). No new
# secret to configure. The endpoint FAILS CLOSED — 503 until the secret is set.

name: Staging blog-autopilot drainer

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes — long-form is slow and low-volume
  workflow_dispatch: {}       # allow manual "Run workflow" from the Actions tab

# If a previous run is still going, don't pile up.
concurrency:
  group: staging-blog-cron
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: POST to staging run-blog-jobs
        env:
          ENDPOINT: "https://staging--bemoreswan.netlify.app/.netlify/functions/run-blog-jobs"
          CRON_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repo secret CRON_TRIGGER_SECRET is not set — the endpoint will reject the call (401/503)."
            exit 1
          fi
          echo "POST $ENDPOINT"
          HTTP_CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            --max-time 300 --retry 2 --retry-delay 5 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$ENDPOINT")
          echo "HTTP $HTTP_CODE"
          echo "----- response body -----"
          cat /tmp/body.txt || true
          echo
          echo "-------------------------"
          case "$HTTP_CODE" in
            2*) echo "OK" ;;
            *)  echo "::error::Worker returned HTTP $HTTP_CODE"; exit 1 ;;
          esac
