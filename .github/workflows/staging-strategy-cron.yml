# Drives the staging Strategy Agent run (Phase 5a of the revenue engine).
#
# Why this exists: Netlify runs scheduled functions ONLY on the production deploy —
# never on branch/preview deploys. Staging (https://staging--bemoreswan.netlify.app)
# is a branch deploy of the `staging` branch, so its `autonomous-strategy-agent` cron
# never fires there. This workflow pokes the SAME run logic over HTTP via
# run-strategy-agent so proposals actually appear on staging.
# Design: docs/lead-generator-revenue-engine-plan.md §7, docs/strategy-agent-plan.md §4.
#
# This does NOT send email and does NOT change anyone's strategy. The run stops at persisting a
# PENDING proposal — an inert row that a human applies from the Strategy tab having read the diff.
# It does spend model budget, and only for orgs with the `strategy_agent` plan feature enabled.
#
# NOTES / LIMITATIONS (identical to staging-sequence-cron.yml):
#  * GitHub Actions `schedule` only runs from the DEFAULT branch (main), ~5-min granularity.
#  * Scheduled workflows only start firing once this file is on `main`.
#  * Production is unaffected — this only talks to the staging URL.
#
# REQUIRED SETUP (reuses the SAME secret as the other drainers):
#  1. GitHub  → repo Settings → Secrets and variables → Actions → CRON_TRIGGER_SECRET
#  2. Netlify → site → Environment variables → CRON_TRIGGER_SECRET (staging/branch-deploy scope)
#  3. db/strategy-proposals.sql applied to the staging database, else the run returns
#     skipped:'migration_pending'.
#  4. The `strategy_agent` feature enabled on at least one org's plan — it is DEFAULT OFF, so
#     until then every cluster is skipped and the run reports proposed:0. That is correct
#     behaviour, not a failure.
#
# ⚠️ It will also report proposed:0 while nobody has edited drafts in the Review Queue: the
# proposer needs MIN_EDIT_SAMPLE (5) edits sharing one reason before it will say anything.
# The wrapper endpoint (run-strategy-agent) FAILS CLOSED — 503 until the secret is set.

name: Staging strategy agent

on:
  schedule:
    - cron: "30 5 * * 1"   # Mondays, offset from the production 05:00 UTC run
  workflow_dispatch: {}       # allow manual "Run workflow" from the Actions tab

# A weekly run cannot realistically overlap itself, but the expiry sweep and the pending-proposal
# check are both read-then-write, so two concurrent runs could each decide a field's slot is free.
concurrency:
  group: staging-strategy-cron
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: POST to staging run-strategy-agent
        env:
          ENDPOINT: "https://staging--bemoreswan.netlify.app/.netlify/functions/run-strategy-agent"
          CRON_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repo secret CRON_TRIGGER_SECRET is not set — the endpoint will reject the call (401/503)."
            exit 1
          fi
          echo "POST $ENDPOINT"
          HTTP_CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            --max-time 300 --retry 2 --retry-delay 5 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$ENDPOINT")
          echo "HTTP $HTTP_CODE"
          echo "----- response body -----"
          cat /tmp/body.txt || true
          echo
          echo "-------------------------"
          case "$HTTP_CODE" in
            2*) echo "OK" ;;
            *)  echo "::error::Worker returned HTTP $HTTP_CODE"; exit 1 ;;
          esac
