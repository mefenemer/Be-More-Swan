name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# A new push to a PR cancels that PR's run still in progress — its result no longer matters.
# Pushes to main/staging are never cancelled: every commit there keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read   # the promote PR reads staging's push run (dedupe + checks below)

jobs:
  # ── One run per commit on a promote PR ──────────────────────────────────────────────────────────
  # A push to staging while a staging → main PR is open fires CI twice on the SAME commit: once for
  # the push, once for the PR. When main has no file changes staging lacks, the PR's merge result
  # IS that commit, so the PR run reuses the push run: the heavy jobs are skipped and the required
  # "Typecheck + tests" check reports the push run's result. If main changed files staging lacks (a
  # hotfix not yet merged back), or no push run is found, everything runs as normal.
  dedupe:
    name: Reuse staging's push run
    if: >-
      github.event_name == 'pull_request' && github.head_ref == 'staging' && github.base_ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      push_run: ${{ steps.find.outputs.push_run }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Files main changed since it last met staging. Usually none (only promote merge commits),
          # and then merging this PR yields exactly staging's commit. A hotfix on main not yet merged
          # back changes files, and the merge result has never been tested: run everything.
          changed=$(gh api "repos/$REPO/compare/$HEAD...$BASE" --jq '.files | length')
          if [ "$changed" != 0 ]; then
            echo "main changed $changed file(s) staging lacks, so the merge result differs: running everything."
            exit 0
          fi
          # The push and the PR fire together; give the push run a minute to appear.
          for i in $(seq 1 12); do
            id=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&branch=staging&head_sha=$HEAD" --jq '.workflow_runs[0].id // empty')
            if [ -n "$id" ]; then
              echo "Reusing https://github.com/$REPO/actions/runs/$id"
              echo "push_run=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "No push run for $HEAD on staging: running everything."

  typecheck:
    name: Typecheck
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.push_run == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  tests:
    name: Tests (${{ matrix.shard }}/3)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.push_run == '' }}
    runs-on: ubuntu-latest
    # Every tests/*.test.ts (pure-logic / mocked; DB tests skip gracefully), split across three
    # runners: each takes every third file (scripts/run-tests.mjs TEST_SHARD) and runs one per core.
    # Includes the tenant-isolation guards (tenant-guard, storage-tenant-isolation).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/run-tests.mjs
        env:
          TEST_SHARD: ${{ matrix.shard }}/3

  # The "Protect main" ruleset requires a check named exactly "Typecheck + tests". This job carries
  # that name and passes only when the typecheck AND all three test runners passed — a skipped,
  # cancelled or failed one fails it. Same checks as `npm run test:all`, just spread out.
  # On a promote PR reusing staging's push run, it waits for that run's "Typecheck + tests" instead.
  checks:
    name: Typecheck + tests
    needs: [dedupe, typecheck, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.dedupe.outputs.push_run != ''
        with:
          sparse-checkout: scripts/ci-mirror-push-job.sh
          sparse-checkout-cone-mode: false
      - name: Same result as staging's push run
        if: needs.dedupe.outputs.push_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ needs.dedupe.outputs.push_run }}
          NAME: Typecheck + tests
        run: bash scripts/ci-mirror-push-job.sh
      - name: Typecheck and every test runner passed
        if: needs.dedupe.outputs.push_run == ''
        run: |
          echo "typecheck: ${{ needs.typecheck.result }}  tests: ${{ needs.tests.result }}"
          [ "${{ needs.typecheck.result }}" = success ] && [ "${{ needs.tests.result }}" = success ]

  e2e:
    name: Browser smoke tests (Playwright ${{ matrix.shard }}/3)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.push_run == '' }}
    runs-on: ubuntu-latest
    # Three runners, each taking a third of the specs with Playwright's usual 2 workers: same tests,
    # same retries, about a third of the wall time. Not a required check, so the name can carry the shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # The browser download is cached per lockfile; the system libraries it needs are installed
      # either way (they live outside the cache).
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Static pages in a real browser, every function stubbed (e2e/fixtures.ts) — no DB or secrets.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      # Read by e2e-report below to name the failed tests in the staging issue. Uploaded on success too,
      # so a missing file means the runner failed before Playwright reported anything.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-json-${{ matrix.shard }}
          path: playwright-json/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # One name for main's ruleset to require: passes only when all three Playwright runners passed
  # (a skipped, cancelled or failed one fails it). On a promote PR reusing staging's push run, it
  # reports that run's "Browser smoke tests" instead — same pattern as "Typecheck + tests".
  e2e-gate:
    name: Browser smoke tests
    needs: [dedupe, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.dedupe.outputs.push_run != ''
        with:
          sparse-checkout: scripts/ci-mirror-push-job.sh
          sparse-checkout-cone-mode: false
      - name: Same result as staging's push run
        if: needs.dedupe.outputs.push_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ needs.dedupe.outputs.push_run }}
          NAME: Browser smoke tests
        run: bash scripts/ci-mirror-push-job.sh
      - name: Every Playwright runner passed
        if: needs.dedupe.outputs.push_run == ''
        run: |
          echo "playwright: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = success ]

  # Staging only: the Playwright result goes to the admin portal's Fix pipeline (prod admin → Issues):
  # a failure opens ONE automatic ticket naming the failed tests, the next passing run closes it
  # (src/utils/ci-test-incident.ts via netlify/functions/report-ci-test-result.ts). If that can't be
  # reached or isn't set up, a GitHub issue labelled `playwright-ci` is the fallback. SwanJira never
  # hears about CI runs — it lives on the owner's Mac. scripts/ci-e2e-report.mjs has the rules.
  e2e-report:
    name: Playwright result → Fix pipeline
    needs: e2e
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci-e2e-report.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: playwright-json-*
          path: playwright-json
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/ci-e2e-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPORT_URL: https://bemoreswan.com/.netlify/functions/report-ci-test-result
          CI_REPORT_SECRET: ${{ secrets.CI_REPORT_SECRET }}
          RESULT: ${{ needs.e2e.result }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          SHARDS: '3'
          JSON_DIR: playwright-json

  rls:
    name: RLS tenant-isolation (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: db/schema.ts has a vector("embedding") column, so a full push needs it.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NETLIFY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aura_test
      APP_DATABASE_URL: postgres://app_user:app_test_pw@localhost:5432/aura_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # schema.ts has a pgvector column; create the extension before pushing.
      - name: Enable pgvector
        run: psql "$NETLIFY_DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      # Build the base schema from db/schema.ts (creates organisations/users/ai_assistants …).
      - name: Provision base schema (drizzle push)
        run: npx drizzle-kit push --force
      # Create the RLS-subject app_user role and apply db/rls/R1-crown-jewels.sql.
      - name: Provision app_user + RLS policies
        run: node scripts/ci-provision-rls.mjs
      # Prove Row-Level Security isolates tenants at the DB layer.
      - name: RLS enforcement test
        run: npx tsx tests/rls-enforcement.test.ts
      # The AI media failure alert's SQL (check-provider-balances), on the same real schema.
      # It also runs in test:all, where it skips — it refuses any database that is not on localhost.
      - name: Media failure evidence query
        run: npx tsx tests/media-failure-evidence.test.ts
      # The Brand Designer's settle-once credit SQL (src/utils/visual-briefs.ts endRound), same schema.
      - name: Brand Designer credit settlement
        run: npx tsx tests/visual-briefs-db.test.ts
      # Facebook/Instagram messages (src/utils/meta-messaging.ts storeMessagingEvent): Meta retries and
      # reorders deliveries; a retry must change nothing and the 24h reply window must only move forward.
      - name: Meta messages filing
        run: npx tsx tests/meta-messaging-db.test.ts
      # The Messages tab's tick (src/utils/social-messages.ts runMessagesTick): one "4 hours left"
      # reminder per reply window, never twice, and the 90-day text purge.
      - name: Meta messages reminders and purge
        run: npx tsx tests/social-messages-db.test.ts
      # Send itself (sendReply) with a fake Meta: the 24h window by the database clock, the per-conversation
      # lock, the repeat guard, and never "try again" once Meta has accepted (that would send it twice).
      - name: Meta messages Send
        run: npx tsx tests/social-messages-send-db.test.ts
      # The single task allowance's money SQL (src/utils/work-metering.ts): weighted charges, bonus
      # tasks spent only past the allowance, in-flight media reserved. A bare parameter in one of these
      # statements took production capacity checks down on 2026-10-17 — only Postgres can catch that.
      - name: Task metering
        run: npx tsx tests/task-metering-db.test.ts
      # The Affiliate Partner Programme's commission ledger (src/utils/partner-ledger.ts): rate lock at
      # first payment, one row per Stripe payment, refunds/disputes, the nightly release — money owed
      # to people outside the company, so it is proven on Postgres, not mocks.
      - name: Partner commission ledger
        run: npx tsx tests/partner-ledger-db.test.ts
      # The Partner Ops read queries (src/utils/partner-ops.ts): the Partners list, top referrers, the
      # pre-payout audit's self-referral signs, recruitment — FILTER aggregates and windows only Postgres proves.
      - name: Partner Ops queries
        run: npx tsx tests/partner-ops-db.test.ts
      # Partner applications (src/utils/partner-applications.ts): one per email, the hashed one-time
      # account link that opens the sign-up lock for the applicant only, claim-once.
      - name: Partner applications
        run: npx tsx tests/partner-applications-db.test.ts
      # Partner payout details (src/utils/partner-payouts.ts): a change waits for the emailed confirmation,
      # applies once, for that partner only, and moves the secret in the vault. Plus the Partner page's numbers.
      - name: Partner payouts
        run: npx tsx tests/partner-payouts-db.test.ts
      # Payout runs (src/utils/partner-payout-batches.ts): who is due, locking rows into a run, no
      # double payment, paid / cancelled, payment files from the vault. This is the step that sends money.
      - name: Partner payout runs
        run: npx tsx tests/partner-payout-runs-db.test.ts
      # A partnership starts when the partner accepts the Partner Terms after approval (src/utils/partner-start.ts):
      # partner_since, the waiting special rate → dated period, atomically and never overlapping.
      - name: Partner start on acceptance
        run: npx tsx tests/partner-start-db.test.ts
      # Partner codes (src/utils/invite-codes.ts): unique across referral and partner codes, the late
      # "Have an invite code?" rules, and partner-code customers recorded as such in the ledger.
      - name: Partner codes
        run: npx tsx tests/partner-codes-db.test.ts
      # Partner erasure (src/utils/partner-erasure.ts): identifying data and vault payout details go, the
      # commission ledger stays (tax law); applicant-only rows deleted; declined ones purged after 12 months.
      - name: Partner erasure
        run: npx tsx tests/partner-erasure-db.test.ts
      # The Fix pipeline's ticket for Playwright failing on staging (src/utils/ci-test-incident.ts):
      # raw SQL on db/z-platform-incidents.sql's columns and its partial unique index.
      - name: CI test failure ticket
        run: npx tsx tests/ci-test-incident-db.test.ts
      # "Ask your shop" (src/utils/shop-sales.ts, online shop Phase 2): UK-month totals of UTC timestamps,
      # after refunds and per currency, and best sellers from basket lines + Buy orders — only Postgres proves them.
      - name: Shop sales totals
        run: npx tsx tests/shop-sales-db.test.ts
      # "Stock that talks" (src/utils/shop-stock-alerts.ts, online shop Phase 2): stock taken per order returns
      # before/after/level (an option's = its product's), so alerts fire once into low and once at sold out.
      - name: Shop stock alerts
        run: npx tsx tests/shop-stock-alerts-db.test.ts
      # Shop buyers who tick "Send me news" (src/utils/shop-buyer-audience.ts, online shop Phase 2): consent always
      # recorded when they end up subscribed (pending → single opt-in), refusals never lifted — proven on Postgres.
      - name: Shop buyers to Audience
        run: npx tsx tests/shop-buyer-audience-db.test.ts
