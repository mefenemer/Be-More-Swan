name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  checks:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Typecheck + every tests/*.test.ts (pure-logic / mocked; DB tests skip gracefully).
      # Includes the tenant-isolation guards (tenant-guard, storage-tenant-isolation).
      - run: npm run test:all

  rls:
    name: RLS tenant-isolation (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: db/schema.ts has a vector("embedding") column, so a full push needs it.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NETLIFY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aura_test
      APP_DATABASE_URL: postgres://app_user:app_test_pw@localhost:5432/aura_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # schema.ts has a pgvector column; create the extension before pushing.
      - name: Enable pgvector
        run: psql "$NETLIFY_DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      # Build the base schema from db/schema.ts (creates organisations/users/ai_assistants …).
      - name: Provision base schema (drizzle push)
        run: npx drizzle-kit push --force
      # Create the RLS-subject app_user role and apply db/rls/R1-crown-jewels.sql.
      - name: Provision app_user + RLS policies
        run: node scripts/ci-provision-rls.mjs
      # Prove Row-Level Security isolates tenants at the DB layer.
      - name: RLS enforcement test
        run: npx tsx tests/rls-enforcement.test.ts
      # The AI media failure alert's SQL (check-provider-balances), on the same real schema.
      # It also runs in test:all, where it skips — it refuses any database that is not on localhost.
      - name: Media failure evidence query
        run: npx tsx tests/media-failure-evidence.test.ts
      # The Brand Designer's settle-once credit SQL (src/utils/visual-briefs.ts endRound), same schema.
      - name: Brand Designer credit settlement
        run: npx tsx tests/visual-briefs-db.test.ts
      # The single task allowance's money SQL (src/utils/work-metering.ts): weighted charges, bonus
      # tasks spent only past the allowance, in-flight media reserved. A bare parameter in one of these
      # statements took production capacity checks down on 2026-10-17 — only Postgres can catch that.
      - name: Task metering
        run: npx tsx tests/task-metering-db.test.ts
      # The Affiliate Partner Programme's commission ledger (src/utils/partner-ledger.ts): rate lock at
      # first payment, one row per Stripe payment, refunds/disputes, the nightly release — money owed
      # to people outside the company, so it is proven on Postgres, not mocks.
      - name: Partner commission ledger
        run: npx tsx tests/partner-ledger-db.test.ts
      # The Partner Ops read queries (src/utils/partner-ops.ts): the Partners list, top referrers, the
      # pre-payout audit's self-referral signs, recruitment — FILTER aggregates and windows only Postgres proves.
      - name: Partner Ops queries
        run: npx tsx tests/partner-ops-db.test.ts
      # Partner applications (src/utils/partner-applications.ts): one per email, the hashed one-time
      # account link that opens the sign-up lock for the applicant only, claim-once.
      - name: Partner applications
        run: npx tsx tests/partner-applications-db.test.ts
      # Partner payout details (src/utils/partner-payouts.ts): a change waits for the emailed confirmation,
      # applies once, for that partner only, and moves the secret in the vault. Plus the Partner page's numbers.
      - name: Partner payouts
        run: npx tsx tests/partner-payouts-db.test.ts
      # Payout runs (src/utils/partner-payout-batches.ts): who is due, locking rows into a run, no
      # double payment, paid / cancelled, payment files from the vault. This is the step that sends money.
      - name: Partner payout runs
        run: npx tsx tests/partner-payout-runs-db.test.ts
      # Partner codes (src/utils/invite-codes.ts): unique across referral and partner codes, the late
      # "Have an invite code?" rules, and partner-code customers recorded as such in the ledger.
      - name: Partner codes
        run: npx tsx tests/partner-codes-db.test.ts
      # Partner erasure (src/utils/partner-erasure.ts): identifying data and vault payout details go, the
      # commission ledger stays (tax law); applicant-only rows deleted; declined ones purged after 12 months.
      - name: Partner erasure
        run: npx tsx tests/partner-erasure-db.test.ts
