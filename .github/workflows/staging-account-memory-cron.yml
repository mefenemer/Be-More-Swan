# Drives the staging account-graph + memory ingestion (Phase 3 of the revenue engine).
#
# Why this exists: Netlify runs scheduled functions ONLY on the production deploy —
# never on branch/preview deploys. Staging (https://staging--bemoreswan.netlify.app)
# is a branch deploy of the `staging` branch, so its `process-account-memory` cron
# never fires there. This workflow pokes the SAME logic over HTTP via run-account-memory.
# Design: docs/lead-generator-revenue-engine-plan.md §5.3.
#
# ⚠️ THIS SPENDS MONEY. Every ingested row is an embedding call to Voyage. The worker is
# bounded per tick (INGEST_BATCH_SIZE in src/config/account-graph.ts), but a large backlog
# will be walked steadily until it is drained.
#
# NOTES / LIMITATIONS (identical to staging-discovery-cron.yml):
#  * GitHub Actions `schedule` only runs from the DEFAULT branch (main), ~5-min granularity.
#  * Scheduled workflows only start firing once this file is on `main`.
#  * Production is unaffected — this only talks to the staging URL.
#
# REQUIRED SETUP (reuses the SAME secret as the other drainers):
#  1. GitHub  → repo Settings → Secrets and variables → Actions → CRON_TRIGGER_SECRET
#  2. Netlify → site → Environment variables → CRON_TRIGGER_SECRET (staging/branch-deploy scope)
#  3. Netlify → VOYAGE_API_KEY. Without it rows are still ingested but stored UNEMBEDDED, and
#     retrieval silently degrades to full-text search. That is a working system that quietly
#     answers worse — check embedding coverage, not just row counts.
#  4. db/account-graph.sql applied to the staging database, else every run returns zeros.
# The wrapper endpoint (run-account-memory) FAILS CLOSED — 503 until the secret is set.

name: Staging account-memory ingestion

on:
  schedule:
    - cron: "40 * * * *"   # hourly, offset from the discovery and sequence drainers
  workflow_dispatch: {}       # allow manual "Run workflow" from the Actions tab

concurrency:
  group: staging-account-memory-cron
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: POST to staging run-account-memory
        env:
          ENDPOINT: "https://staging--bemoreswan.netlify.app/.netlify/functions/run-account-memory"
          CRON_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repo secret CRON_TRIGGER_SECRET is not set — the endpoint will reject the call (401/503)."
            exit 1
          fi
          echo "POST $ENDPOINT"
          HTTP_CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            --max-time 120 --retry 2 --retry-delay 5 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$ENDPOINT")
          echo "HTTP $HTTP_CODE"
          echo "----- response body -----"
          cat /tmp/body.txt || true
          echo
          echo "-------------------------"
          case "$HTTP_CODE" in
            2*) echo "OK" ;;
            *)  echo "::error::Worker returned HTTP $HTTP_CODE"; exit 1 ;;
          esac
