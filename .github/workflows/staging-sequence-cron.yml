# Drives the staging outreach-sequence worker (Phase 2b of the revenue engine).
#
# Why this exists: Netlify runs scheduled functions ONLY on the production deploy —
# never on branch/preview deploys. Staging (https://staging--bemoreswan.netlify.app)
# is a branch deploy of the `staging` branch, so its `process-sequence-sends` cron
# never fires there. This workflow pokes the SAME drain logic over HTTP via
# run-sequence-sends so follow-ups actually go out on staging.
# Design: docs/lead-generator-revenue-engine-plan.md §5.2.
#
# ⚠️ THIS SENDS REAL EMAIL from whatever mailbox the staging tenant has connected.
# It is not a dry run. If staging is ever pointed at a live prospect list, this workflow
# will email those people. Keep staging's Lead Generator on test addresses.
#
# NOTES / LIMITATIONS (identical to staging-discovery-cron.yml):
#  * GitHub Actions `schedule` only runs from the DEFAULT branch (main), ~5-min granularity.
#  * Scheduled workflows only start firing once this file is on `main`.
#  * Production is unaffected — this only talks to the staging URL.
#
# REQUIRED SETUP (reuses the SAME secret as the other drainers):
#  1. GitHub  → repo Settings → Secrets and variables → Actions → CRON_TRIGGER_SECRET
#  2. Netlify → site → Environment variables → CRON_TRIGGER_SECRET (staging/branch-deploy scope)
#  3. db/outreach-sequences.sql applied to the staging database, else every run returns
#     claimed:0 and nothing ever sends — a silent no-op that looks exactly like "nothing due".
# The wrapper endpoint (run-sequence-sends) FAILS CLOSED — 503 until the secret is set.

name: Staging outreach-sequence sender

on:
  schedule:
    - cron: "20 * * * *"   # hourly, offset from the discovery drainer
  workflow_dispatch: {}       # allow manual "Run workflow" from the Actions tab

# If a previous run is still going, don't pile up — the worker leases claimed rows for 5 minutes
# and overlapping ticks would fight over them.
concurrency:
  group: staging-sequence-cron
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: POST to staging run-sequence-sends
        env:
          ENDPOINT: "https://staging--bemoreswan.netlify.app/.netlify/functions/run-sequence-sends"
          CRON_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repo secret CRON_TRIGGER_SECRET is not set — the endpoint will reject the call (401/503)."
            exit 1
          fi
          echo "POST $ENDPOINT"
          HTTP_CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            --max-time 120 --retry 2 --retry-delay 5 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$ENDPOINT")
          echo "HTTP $HTTP_CODE"
          echo "----- response body -----"
          cat /tmp/body.txt || true
          echo
          echo "-------------------------"
          case "$HTTP_CODE" in
            2*) echo "OK" ;;
            *)  echo "::error::Worker returned HTTP $HTTP_CODE"; exit 1 ;;
          esac
