name: License Gate

on:
  push:
    branches: [main, test]
    paths:
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

# No write access needed: this workflow only scans and reports. It never
# pushes back to the repo, so the default read-only token is sufficient.
permissions:
  contents: read

jobs:
  license-scan:
    name: Scan dependency licenses
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install license-checker
        run: npm install -g license-checker

      # ── Hard-block: GPL, AGPL, EUPL, CCDL ───────────────────────────────────
      # Fail immediately if any transitive dependency uses a copyleft license
      # that would require source disclosure on SaaS deployment.
      - name: Check for blocked licenses
        run: |
          echo "Scanning for blocked licenses (GPL, AGPL, EUPL, CCDL)..."
          license-checker \
            --excludePrivatePackages \
            --failOn "GPL-1.0;GPL-1.0-only;GPL-1.0-or-later;GPL-2.0;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0;AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;EUPL-1.0;EUPL-1.1;EUPL-1.2;CDDL-1.0;CDDL-1.1" \
            --json > /dev/null
          echo "No blocked licenses found."

      # ── Flag for review: LGPL, MPL ──────────────────────────────────────────
      # These require linking hygiene but don't block; output a warning.
      - name: Warn on review-required licenses
        run: |
          echo "Checking for licenses that require manual review (LGPL, MPL)..."
          REVIEW=$(license-checker --excludePrivatePackages --json | \
            node -e "
              const d = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
              const flagged = Object.entries(d)
                .filter(([,v]) => /LGPL|MPL/i.test(v.licenses || ''))
                .map(([k,v]) => k + ' → ' + v.licenses);
              if (flagged.length) {
                console.warn('⚠️  Review-required licenses found:');
                flagged.forEach(l => console.warn('  ' + l));
              } else {
                console.log('No review-required licenses found.');
              }
            ")
          echo "$REVIEW"

      # ── Generate THIRD-PARTY-NOTICES ─────────────────────────────────────────
      - name: Generate THIRD-PARTY-NOTICES
        run: node scripts/generate-notices.js

      # ── Upload the freshly generated notices as a build artifact ─────────────
      # Makes the regenerated file downloadable from the workflow run regardless
      # of whether it matches what's committed.
      - name: Upload THIRD-PARTY-NOTICES artifact
        uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES

      # ── Report (non-blocking) if committed notices drifted ───────────────────
      # We deliberately do NOT fail here. THIRD-PARTY-NOTICES is platform-
      # dependent (npm installs OS/arch-specific native binaries — @esbuild/*,
      # @napi-rs/canvas-*, @tailwindcss/oxide-*, @parcel/watcher-*), so a file
      # generated on a Mac dev machine can never byte-match one generated on the
      # Linux CI runner. A hard gate would therefore stay red forever. Instead we
      # surface drift as a warning and publish the freshly generated file as an
      # artifact (uploaded above) for anyone who needs the canonical copy.
      - name: Report THIRD-PARTY-NOTICES drift (non-blocking)
        run: |
          git add THIRD-PARTY-NOTICES
          if git diff --cached --quiet; then
            echo "THIRD-PARTY-NOTICES is up to date."
          else
            echo "::warning::THIRD-PARTY-NOTICES differs from the freshly generated file. Download the 'third-party-notices' artifact from this run for the current copy. (Note: output is platform-specific — regenerate on Linux to byte-match CI.)"
            git diff --cached --stat -- THIRD-PARTY-NOTICES
          fi
