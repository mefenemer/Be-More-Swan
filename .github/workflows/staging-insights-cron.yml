# Drives the staging Instagram insights ingest.
#
# Why this exists: Netlify runs scheduled functions ONLY on the production deploy —
# never on branch/preview deploys. Staging (https://staging--bemoreswan.netlify.app)
# is a branch deploy of the `staging` branch, so its `ingest-instagram-insights` cron
# never fires there. Without it, post_insights stays empty on staging and the
# assistant-detail "Performance Metrics" cards read "No published-post data yet"
# forever, however much the assistant has actually published.
#
# This workflow pokes the staging worker over HTTP so insights are collected on staging
# the same way the native cron does it on production. Same pattern as
# staging-goal-telemetry-cron.yml / staging-content-cron.yml.
#
# REQUIRED SETUP: reuses the SAME CRON_TRIGGER_SECRET as the other staging cron
# workflows (GitHub repo secret + Netlify env var, both already required for those).
# The wrapper endpoint (run-insights-ingest) FAILS CLOSED — it returns 503 until the
# secret is set, so it can never be an open, cost-incurring endpoint. That matters more
# here than for the other workers: this one issues paid Graph API calls.

name: Staging Instagram insights ingest

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours, matching ingest-instagram-insights's production cadence
  workflow_dispatch: {}     # allow manual "Run workflow" from the Actions tab

# If a previous run is still going, don't pile up — the ingest re-fetches a rolling
# 30-day window, so two overlapping runs would duplicate every Graph API call.
concurrency:
  group: staging-insights-cron
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: POST to staging run-insights-ingest
        env:
          ENDPOINT: "https://staging--bemoreswan.netlify.app/.netlify/functions/run-insights-ingest"
          CRON_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repo secret CRON_TRIGGER_SECRET is not set — the endpoint will reject the call (401/503)."
            exit 1
          fi
          echo "POST $ENDPOINT"
          HTTP_CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            --max-time 120 --retry 2 --retry-delay 5 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$ENDPOINT")
          echo "HTTP $HTTP_CODE"
          echo "----- response body -----"
          cat /tmp/body.txt || true
          echo
          echo "-------------------------"
          case "$HTTP_CODE" in
            2*) echo "OK" ;;
            *)  echo "::error::Worker returned HTTP $HTTP_CODE"; exit 1 ;;
          esac
