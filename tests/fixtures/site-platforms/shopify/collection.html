<!doctype html>
<!-- SYNTHETIC fixture: a Dawn /collections/candles page (collection banner + product grid). Made-up shop. -->
<html class="js" lang="en">
<head>
  <meta charset="utf-8">
  <title>All candles – Hollow Oak Candle Co.</title>
  <script>var Shopify = Shopify || {}; Shopify.shop = "hollow-oak-candles.myshopify.com"; Shopify.theme = {"name":"Dawn","schema_name":"Dawn","role":"main"};</script>
</head>
<body class="gradient">
  <main id="MainContent" class="content-for-layout focus-none" role="main" tabindex="-1">
    <section id="shopify-section-template--500__banner" class="shopify-section section">
      <div class="collection-hero color-background-1 gradient"><div class="collection-hero__inner page-width">
        <h1 class="collection-hero__title"><span class="visually-hidden">Collection: </span>All candles</h1>
        <div class="collection-hero__description rte"><p>Every scent we pour, in 30cl amber jars.</p></div>
      </div></div>
    </section>
    <section id="shopify-section-template--500__product-grid" class="shopify-section section">
      <div class="facets-container">
        <facet-filters-form class="facets small-hide">
          <form id="FacetFiltersForm" class="facets__form"><label for="SortBy">Sort by:</label><select name="sort_by" id="SortBy"><option value="manual">Featured</option></select></form>
        </facet-filters-form>
        <div class="product-count light" role="status"><h2 class="product-count__text text-body"><span id="ProductCountDesktop">2 products</span></h2></div>
      </div>
      <div class="product-grid-container" id="ProductGridContainer"><div class="collection page-width">
        <ul id="product-grid" class="grid product-grid grid--4-col-desktop">
          <li class="grid__item"><div class="card-wrapper product-card-wrapper"><div class="card card--standard card--media">
            <div class="card__inner ratio"><div class="card__media"><div class="media media--transparent">
              <img srcset="//hollowoak.example/cdn/shop/files/moorland-candle-1.jpg?v=1700000003&amp;width=360 360w, //hollowoak.example/cdn/shop/files/moorland-candle-1.jpg?v=1700000003&amp;width=533 533w" src="//hollowoak.example/cdn/shop/files/moorland-candle-1.jpg?v=1700000003&amp;width=533" alt="Moorland Heather candle in an amber jar" loading="lazy" width="1600" height="1600">
            </div></div></div>
            <div class="card__content"><div class="card__information">
              <h3 class="card__heading h5"><a href="/products/moorland-heather-candle" class="full-unstyled-link">Moorland Heather Candle</a></h3>
              <div class="card-information"><div class="price"><div class="price__container"><div class="price__regular"><span class="visually-hidden visually-hidden--inline">Regular price</span><span class="price-item price-item--regular">£18.00 GBP</span></div></div></div></div>
            </div></div>
          </div></div></li>
          <li class="grid__item"><div class="card-wrapper product-card-wrapper"><div class="card card--standard card--media">
            <div class="card__inner ratio"><div class="card__media"><div class="media media--transparent">
              <img srcset="//hollowoak.example/cdn/shop/files/river-candle-1.jpg?v=1700000004&amp;width=533 533w" src="//hollowoak.example/cdn/shop/files/river-candle-1.jpg?v=1700000004&amp;width=533" alt="Calder River candle on a stone sill" loading="lazy" width="1600" height="1600">
            </div></div></div>
            <div class="card__content"><div class="card__information">
              <h3 class="card__heading h5"><a href="/products/calder-river-candle" class="full-unstyled-link">Calder River Candle</a></h3>
              <div class="card-information"><div class="price"><div class="price__container"><div class="price__regular"><span class="visually-hidden visually-hidden--inline">Regular price</span><span class="price-item price-item--regular">From £16.00 GBP</span></div></div></div></div>
            </div></div>
          </div></div></li>
        </ul>
        <div class="pagination-wrapper"><nav class="pagination" role="navigation" aria-label="Pagination"><ul class="pagination__list list-unstyled" role="list"><li><a href="/collections/candles?page=2" class="pagination__item link">2</a></li></ul></nav></div>
      </div></div>
    </section>
  </main>
</body>
</html>
