<div class="flex flex-col h-full min-h-[calc(100vh-64px)]">

  <!-- ── Toolbar ──────────────────────────────────────────────────── -->
  <div class="bg-white border-b border-gray-200 px-4 sm:px-6 py-3 flex items-center justify-between gap-3 flex-wrap">

    <!-- Left: navigation -->
    <div class="flex items-center gap-2">
      <!-- Quiet tools, so .btn-utility (the house button rule), and 44px targets on a phone. The
           arrows' accessible name ("Previous month" / "Previous week") is set by calendar.js. -->
      <button id="cal-btn-prev" type="button" aria-label="Previous month"
        class="btn-utility focus-ring tap-target p-2 rounded-lg inline-flex items-center justify-center cursor-pointer">
        <svg class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button id="cal-btn-today" type="button"
        class="btn-secondary focus-ring tap-target px-3 py-1.5 text-sm font-bold rounded-lg border cursor-pointer">
        Today
      </button>
      <button id="cal-btn-next" type="button" aria-label="Next month"
        class="btn-utility focus-ring tap-target p-2 rounded-lg inline-flex items-center justify-center cursor-pointer">
        <svg class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
      <h2 id="cal-title" aria-live="polite" class="text-base sm:text-lg font-extrabold text-gray-900 ml-1"></h2>
    </div>

    <!-- Right: assistant filter + view toggle -->
    <div class="flex items-center gap-3 flex-wrap">
      <!-- Platform filter. Social/blog roles only: the per-assistant Calendar tab injects this
           same fragment for EVERY role (assistant-calendar.js), so a Lead Generator — which
           publishes nothing — was being offered an Instagram/YouTube filter over a grid that can
           only ever hold chase reminders and completed task runs. calendar.js hides it when
           initCalendar is told the assistant doesn't publish content. -->
      <select id="cal-platform-filter" aria-label="Show platform"
        class="tap-target text-sm font-semibold text-gray-700 border border-gray-300 rounded-lg px-3 py-1.5 bg-white cursor-pointer focus:outline-none focus:ring-2 focus:ring-emerald-700">
        <!-- All six social platforms (src/config/platform-formats.ts) plus Blog and Newsletter.
             Threads and YouTube were missing, so posts on them could not be filtered for at all.
             ⚠️ The last two are not platforms — this control filters by DESTINATION, which is what
             the entries in calendar.js's PLATFORM_META actually are. -->
        <option value="all">All platforms</option>
        <option value="facebook">Facebook</option>
        <option value="instagram">Instagram</option>
        <option value="linkedin">LinkedIn</option>
        <option value="x">X (Twitter)</option>
        <option value="threads">Threads</option>
        <option value="youtube">YouTube</option>
        <option value="blog">Blog</option>
        <option value="newsletter">Email</option>
      </select>
      <!-- #4: filter calendar to a single assistant's activity -->
      <select id="cal-assistant-filter" aria-label="Show assistant"
        class="tap-target max-w-full truncate text-sm font-semibold text-gray-700 border border-gray-300 rounded-lg px-3 py-1.5 bg-white cursor-pointer focus:outline-none focus:ring-2 focus:ring-emerald-700">
        <option value="all">All assistants</option>
      </select>
      <!-- A segmented control: calendar.js sets aria-pressed and the look from the view on screen.
           Month and Week are hidden on a phone, where seven columns are ~48px each — which leaves only
           List, so the whole control goes there. -->
      <div class="phone-hidden flex items-center gap-1 bg-gray-100 rounded-xl p-1" role="group" aria-label="View">
        <button type="button" data-view="month" id="view-month" aria-pressed="true"
          class="cal-view-btn focus-ring tap-target phone-hidden px-3 py-1.5 text-sm font-bold rounded-lg transition cursor-pointer bg-white shadow text-gray-900">
          Month
        </button>
        <button type="button" data-view="week" id="view-week" aria-pressed="false"
          class="cal-view-btn focus-ring tap-target phone-hidden px-3 py-1.5 text-sm font-bold rounded-lg transition cursor-pointer text-gray-500 hover:text-gray-700">
          Week
        </button>
        <button type="button" data-view="list" id="view-list" aria-pressed="false"
          class="cal-view-btn focus-ring tap-target px-3 py-1.5 text-sm font-bold rounded-lg transition cursor-pointer text-gray-500 hover:text-gray-700">
          List
        </button>
      </div>
      <!-- Owners plan by date ("something for Friday"), and creating used to live only on Review.
           Revealed by calendar.js once an assistant that can post is known; clicking an empty
           future day does the same with that day filled in. -->
      <button type="button" id="cal-new-post" onclick="window._calNewPost()"
        class="hidden btn-primary focus-ring tap-target px-3 py-1.5 text-sm font-bold rounded-lg items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        New post
      </button>
      <!-- Phone only: the two legend strips below fold behind this, so posts start higher up. -->
      <button type="button" id="cal-key-toggle" aria-expanded="false" aria-controls="cal-status-legend"
        class="sm:hidden btn-utility focus-ring tap-target px-3 py-1.5 text-sm font-bold rounded-lg border">Key</button>
    </div>
  </div>

  <!-- #4: per-assistant colour legend -->
  <div id="cal-legend" class="hidden phone-hidden bg-white border-b border-gray-100 px-4 sm:px-6 py-2 flex items-center gap-4 flex-wrap"></div>

  <!-- Status legend: makes the posted / scheduled / overdue markers self-explanatory.
       "Posted (live)" and "Overdue" are publishing vocabulary — for a non-publishing role the grid
       holds only 🗓 scheduled records and ✓ completed task runs, so calendar.js rewrites this strip
       (_renderStatusLegend) rather than explaining markers that role can never show. -->
  <div id="cal-status-legend" class="phone-hidden bg-white border-b border-gray-100 px-4 sm:px-6 py-2 flex items-center gap-4 flex-wrap">
    <!-- Written by calendar.js (_renderStatusLegend) from the same labels the chips use. -->
  </div>

  <!-- ── Calendar body ────────────────────────────────────────────── -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- Main calendar area -->
    <div id="cal-main" class="flex-1 overflow-y-auto bg-gray-50" aria-busy="true">
      <!-- Populated by calendar.js -->
      <div class="flex items-center justify-center py-20 text-gray-500 text-sm">
        <span class="animate-spin mr-3" role="status" aria-label="Loading" style="display:inline-block;box-sizing:border-box;width:20px;height:20px;border-radius:9999px;border:3px solid #eae4d7;border-top-color:#ff007f;flex-shrink:0;"></span>
        Loading calendar…
      </div>
    </div>

    <!-- The calendar used to carry its OWN post panel here: a slide-out with Publishing
         Logistics (platform, format), an Edit Copy textarea, and its own approve/reject/cancel
         buttons. It was a second, older post editor — the one surface the editor amalgamation
         never reached — so a post opened from the calendar offered a different set of controls
         from the same post opened anywhere else. Clicking a chip now opens the real editor
         (openPostReview in workspace.html); see _calOpenPost. Its reject and past-schedule
         modals went with it, because the editor owns both of those decisions now.
         Rescheduling stays here — dragging a chip, or "Move…" on a list row — and confirms through
         /dialogs.js (confirmModal / promptModal) like every other dialog in the app. -->
  </div>
</div>
