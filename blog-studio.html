<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Studio — Be More Swan</title>
  <link href="./style.css" rel="stylesheet">
  <!-- Markdown rendering for the editor (same libs/versions as workspace.html) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body class="bg-gray-50">
  <!--
    Blog Studio is now a native modal (src/components/blog-studio-modal.js) launched from the
    Review Queue / Calendar / Assistant Detail surfaces inside the workspace SPA. This standalone
    page is kept as a thin delegator so any existing direct link (incl. ?postId deep-links) still
    works: it loads the shared module and opens the modal full-screen over a blank page.
  -->
  <script src="./src/components/markdown-editor.js"></script>
  <script src="./src/components/blog-studio-modal.js"></script>
  <script>
    (function () {
      var m = (location.search || '').match(/[?&]postId=(\d+)/);
      window.openBlogStudio({ postId: m ? Number(m[1]) : undefined });
      // On this standalone page there's nowhere to return to — closing reopens the empty brief.
      var origClose = window.closeBlogStudio;
      window.closeBlogStudio = function () { origClose(); window.openBlogStudio({}); };
    })();
  </script>
</body>
</html>
