<!-- team.html — the Team feed (view fragment, loaded by workspace.html's router).
     Controller: src/components/team-feed.js (window.initTeam). docs/campaign-orchestrator-flow.md §4.
     Org-wide: every assistant's messages, and every campaign's. -->
<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full pb-20">
  <div class="mb-6">
    <h1 class="text-3xl font-extrabold text-gray-900"><span data-explain="team-feed">Team Chat</span></h1>
    <p class="text-gray-500 mt-1">What your assistants are doing, in their words — and where you can tell them something or answer their questions.</p>
  </div>
  <style>
    /* Two columns from md up; one on a phone. Inline because the prebuilt style.css has no such grid utility. */
    @media (min-width: 768px) { #team-host .team-grid { grid-template-columns: 16rem minmax(0, 1fr); } }
  </style>
  <div id="team-host"></div>
</div>
