<div class="p-4 sm:p-6">

  <!-- Page header -->
  <div class="flex flex-wrap items-start justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-extrabold text-gray-900">Review</h1>
      <p class="text-sm text-gray-600 mt-1">Approve or amend posts, articles and emails before they go out, and fix anything that needs attention.</p>
    </div>
    <!-- Wraps on a phone, where two buttons and the assistant picker don't fit one 327px row. One
         primary: the page's job is reviewing, so the second "create" button is secondary. -->
    <div class="flex flex-wrap items-center gap-2 max-w-full">
      <!-- Blog Studio entry — shown only when an active Blog Writer assistant exists (gated below). -->
      <button id="rq-blog-btn" type="button" onclick="_rqOpenBlogStudio()" class="hidden btn-secondary focus-ring tap-target px-4 py-2 text-sm font-bold rounded-lg border transition cursor-pointer items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Blog Post
      </button>
      <!-- Who the post gets created under. This view is org-wide, so unlike the assistant workspace
           it has no assistant in context — revealed below only when there's a genuine choice. -->
      <select id="rq-post-assistant" aria-label="Assistant to create the post under"
        class="hidden tap-target max-w-full truncate px-3 py-2 text-sm border border-gray-300 rounded-lg bg-white cursor-pointer focus:outline-none focus:ring-2 focus:ring-emerald-700"></select>
      <!-- Hidden until an assistant that can post is resolved (gated below), same as the blog entry. -->
      <button id="rq-create-post-btn" type="button" onclick="_rqCreatePost()" class="hidden btn-primary focus-ring tap-target px-4 py-2 text-sm font-bold rounded-lg transition cursor-pointer items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Social Media Post
      </button>
    </div>
  </div>

  <!-- Card with lifecycle columns + grouped content -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">

    <!-- Lifecycle columns -->
    <!-- Only the columns that need the user. Approved / Scheduled / Posted / Archived were removed
         here to cut clutter and the fetch each one costs; RQ_COLUMNS in workspace.html still knows
         them, and the assistant workspace's own review tab (assistants.js) still shows them. -->
    <!-- Tabs, said as tabs (role/aria-selected — rqOpenStatus keeps them current). The active one is
         brand deep pink: border-emerald-600 is still GREEN in this build, so the old active tab was
         pink text over a green underline. "To approve" rather than a "Review" tab on the Review page. -->
    <div role="tablist" aria-label="Review" class="flex gap-1 px-4 pt-3 border-b border-gray-100 overflow-x-auto">
      <button type="button" role="tab" aria-selected="true" aria-controls="rq-groups" tabindex="0"
        class="rq-col focus-ring tap-target px-4 py-2 text-sm font-semibold rounded-t border-b-2 border-brand text-emerald-800 whitespace-nowrap"
        data-status="review" onclick="_rqSafeOpenStatus('review', this)">
        To approve
        <span id="rq-col-count-review" class="ml-1 bg-amber-100 text-amber-800 text-xs px-1.5 py-0.5 rounded-full hidden"></span>
      </button>
      <!-- Posts that tried to publish and stopped. Until this column existed they were in no
           lifecycle view at all: 'failed' is not 'rejected', so Archived never showed them, and the
           calendar was the only surface that rendered one. -->
      <!-- Failed, plus posts paused on a dead connection or a spent X limit — the same list as the
           Calendar's "Needs attention" tab (post-status.ts NEEDS_ATTENTION_STATUSES). -->
      <button type="button" role="tab" aria-selected="false" aria-controls="rq-groups" tabindex="-1"
        class="rq-col focus-ring tap-target px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 rounded-t whitespace-nowrap"
        data-status="attention" onclick="_rqSafeOpenStatus('attention', this)">Needs attention
        <span id="rq-col-count-attention" class="ml-1 bg-red-100 text-red-700 text-xs px-1.5 py-0.5 rounded-full hidden"></span>
      </button>
    </div>

    <!-- Grouped, collapsible content -->
    <div id="rq-groups" role="tabpanel" aria-live="polite" class="px-4 py-2 min-h-[200px]"></div>

  </div>
</div>

<script>
(function initReviewQueuePage() {
  // rqOpenStatus lives in workspace.html's main script, which normally finishes loading
  // well before this view is ever reachable — but this view's own <script> is re-executed
  // synchronously right after its markup is injected (see loadView() in workspace.html),
  // so on a slow/first load there's a narrow window where the tab buttons above could be
  // clicked before that global exists, throwing "rqOpenStatus is not defined" out of the
  // onclick handler. Route clicks through this always-defined wrapper instead.
  window._rqSafeOpenStatus = function (statusKey, btn) {
    if (typeof rqOpenStatus === 'function') rqOpenStatus(statusKey, btn);
  };
  window._rqSafeOpenStatus('review', document.querySelector('.rq-col[data-status="review"]'));
  // Arrow keys move between the tabs, as tabs are expected to behave.
  var tabBar = document.querySelector('[role="tablist"][aria-label="Review"]');
  if (tabBar && !tabBar.dataset.keys) {
    tabBar.dataset.keys = '1';
    tabBar.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var tabs = Array.prototype.slice.call(tabBar.querySelectorAll('[role="tab"]'));
      var i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      var next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      next.focus(); next.click();
    });
  }
  // Count the Needs-attention column NOW. Opening the page only loads the Review column, and the
  // 60s badge poll writes this counter only when it happens to run while the page is up (on any
  // other view the element does not exist) — so the tab sat blank until clicked, or for up to a
  // minute. The markup is in the DOM at this point, so one poll fills both counters.
  if (typeof refreshPendingBadge === 'function') { try { refreshPendingBadge(); } catch { /* non-blocking */ } }

  // "+ Social Media Post" — resolve the assistant here rather than inheriting one.
  //
  // A post row belongs to an assistant, but this view is org-wide (it fetches every assistant's
  // drafts), so there is nothing to inherit. The button used to call openGeneratePostSheet() with
  // no argument, which fell back to window._currentAssistantId: unset on a fresh load, so the click
  // dead-ended on "Pick an assistant first" with no picker anywhere on the page to pick one from.
  // Resolve the eligible assistants up front instead — hide the button when there are none, use the
  // only one when there is one, and offer the choice on the page when there is more than one.
  var _rqPostAssistants = [];
  window._rqCreatePost = function () {
    var sel = document.getElementById('rq-post-assistant');
    var picked = (sel && !sel.classList.contains('hidden') && sel.value) ? Number(sel.value) : null;
    var id = picked || (_rqPostAssistants[0] && _rqPostAssistants[0].id) || null;
    // A null id would land back on the toast, but only on the fallback path below, where the
    // button is revealed unresolved and openGeneratePostSheet's own context lookup still applies.
    window.openGeneratePostSheet(id);
  };
  function _rqShowCreatePost() {
    var btn = document.getElementById('rq-create-post-btn');
    // Both classes: `hidden` alone loses to the button's own `items-center` display utility.
    if (btn) { btn.classList.remove('hidden'); btn.classList.add('flex'); }
  }
  if (typeof window.resolvePostingAssistants === 'function') {
    window.resolvePostingAssistants().then(function (list) {
      _rqPostAssistants = Array.isArray(list) ? list : [];
      // No assistant can post — leave the button hidden rather than offer a click that cannot work.
      if (!_rqPostAssistants.length) return;
      _rqShowCreatePost();
      if (_rqPostAssistants.length < 2) return;   // nothing to choose between
      var sel = document.getElementById('rq-post-assistant');
      if (!sel) return;
      sel.innerHTML = '';
      _rqPostAssistants.forEach(function (a) {
        var o = document.createElement('option');
        o.value = String(a.id);
        // textContent, not innerHTML — these are user-chosen assistant names.
        o.textContent = a.role ? a.name + ' — ' + a.role : a.name;
        sel.appendChild(o);
      });
      sel.classList.remove('hidden');
    });
  } else {
    // Resolver missing (this view's script racing workspace.html's, the same window
    // _rqSafeOpenStatus guards above): show the button and let it behave as it did before.
    _rqShowCreatePost();
  }

  // Blog Studio entry — only when the org has an active Blog Writer assistant.
  var _rqBlogWriterId = null;
  window._rqOpenBlogStudio = function () {
    if (typeof window.openBlogStudio === 'function') window.openBlogStudio({ assistantId: _rqBlogWriterId });
  };
  if (typeof window.resolveBlogWriter === 'function') {
    window.resolveBlogWriter().then(function (bw) {
      if (!bw) return;
      _rqBlogWriterId = bw.id;
      var btn = document.getElementById('rq-blog-btn');
      if (btn) { btn.classList.remove('hidden'); btn.classList.add('flex'); }
    });
  }
})();
</script>
