# powered-by.html is the co-branded attribution page behind a customer's "Powered by Be More Swan"
# badge. The soft 404 this rule was originally compensating for is FIXED — its parameter-less state
# rendered a "Page Not Found" card at HTTP 200, and now renders a real explainer of what the badge
# means — but the rule stays, deliberately, and is no longer a stopgap:
#
#   • The page's whole content is per-agency (/powered-by/<slug>), so indexing it means indexing a
#     variant per customer. That is a thin-content set built out of other businesses' names, not
#     pages anyone searches for.
#   • Nothing here is a search destination. The badge is the only way anyone arrives, and it is a
#     link we already control.
#
# Indexing it would need a self-canonical to collapse the slug variants plus an entry in
# sitemap.xml. That is machinery in service of a page with no organic demand — so: keep noindex.
[[headers]]
  for = "/powered-by*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── auth-guard bindings ─────────────────────────────────────────────────────────
# Netlify serves every page at BOTH /foo.html and /foo. These two rules used to be the whole
# binding, and neither matches the extensionless form — so /admin returned the complete admin
# page to anyone who asked, unauthenticated, while /admin.html correctly 302'd to login.
# admin.html has no client-side auth-check.js, so this function was the only thing guarding it.
#
# The extensionless spellings of every protected page are therefore bound explicitly below.
#
# WHY NOT path = "/*" WITH EXCLUSIONS. A catch-all is drift-proof — a new protected page is
# covered without anyone remembering a binding — but it puts the edge function in front of every
# static asset on the site: style.css, every image, every .js file. That is an edge invocation on
# each one, billed and latency-bearing, and the exclusion list becomes the thing that must not be
# got wrong. Its one real advantage, drift-proofing, is bought more cheaply by the sync test:
# tests/auth-guard-paths.test.ts fails the build if PROTECTED_PATHS and these bindings disagree.
#
# ⚠️ ADDING A PROTECTED PAGE MEANS THREE EDITS: PROTECTED_PATHS in auth-guard.ts, and BOTH
# spellings here. The test enforces it, but it can only check what it is told to check.

[[edge_functions]]
  function = "auth-guard"
  path = "/*.html" # Maintenance mode + session guard on all HTML pages

[[edge_functions]]
  function = "auth-guard"
  path = "/"

# Extensionless spellings of PROTECTED_PATHS (netlify/edge-functions/auth-guard.ts).
[[edge_functions]]
  function = "auth-guard"
  path = "/workspace"

[[edge_functions]]
  function = "auth-guard"
  path = "/onboarding"

[[edge_functions]]
  function = "auth-guard"
  path = "/dashboard"

[[edge_functions]]
  function = "auth-guard"
  path = "/billing"

[[edge_functions]]
  function = "auth-guard"
  path = "/admin"

# US-GAP-7.1.1: In-memory rate limiting for sensitive endpoints
[[edge_functions]]
  function = "rate-limit"
  path = "/.netlify/functions/register"

[[edge_functions]]
  function = "rate-limit"
  path = "/.netlify/functions/login"

[[edge_functions]]
  function = "rate-limit"
  path = "/.netlify/functions/onboarding"

[[edge_functions]]
  function = "rate-limit"
  path = "/.netlify/functions/support-tickets"

# SC3: Daily task-volume threshold check — 08:00 UTC every day
[functions.task-volume-check]
  schedule = "0 8 * * *"

# Reverse the quota pause task-volume-check applies, once the org is back under its allowance.
# 00:15 UTC daily — just after the UTC month rolls over (usage_counters.period_start), so a
# customer whose allowance has reset finds their assistants already working. Daily rather than
# monthly so a mid-month upgrade also resumes them.
[functions.resume-quota-paused]
  schedule = "15 0 * * *"

# US 5.2: resolve widget A/B hook tests (promote the winning variant) — hourly
[functions.resolve-ab-tests]
  schedule = "0 * * * *"

# US 4.1: publish due scheduled blog posts — every 5 minutes
[functions.publish-blog-posts]
  schedule = "*/5 * * * *"

# US 5.1: ingest Search Console metrics + flag decayed blog posts — 06:00 UTC every day
[functions.ingest-gsc-metrics]
  schedule = "0 6 * * *"

# US-ADM-2.3.1: Stripe↔DB nightly billing reconciliation — 02:00 UTC every day
[functions.reconcile-billing]
  schedule = "0 2 * * *"

# Single-source price management: flip scheduled plan price changes live — every 15 min
[functions.activate-scheduled-prices]
  schedule = "*/15 * * * *"

# US-SALES-1.1 Part 4: Nightly lead identification — 03:00 UTC every day
[functions.identify-leads]
  schedule = "0 3 * * *"

# Lead Generator outbound discovery — hourly dispatcher enqueues due campaign runs,
# and the worker drains the queue every 10 minutes (bounded slices, resumable via cursor).
# docs/lead-generator-discovery-plan.md. Staging drives these via run-discovery-jobs.ts.
[functions.dispatch-discovery-runs]
  schedule = "0 * * * *"
[functions.process-discovery-jobs]
  schedule = "*/10 * * * *"

# Outreach sequences (Phase 2b of docs/lead-generator-revenue-engine-plan.md §5.2) — sends the
# follow-up for any enrolment whose next_send_at has passed. Hourly, not every 10 minutes: cadence
# steps are measured in DAYS, so a sub-hour interval would only add invocations, and each tick
# claims its rows with a 5-minute lease that assumes ticks are not overlapping.
# Staging drives this via run-sequence-sends.ts (branch deploys never fire native crons).
[functions.process-sequence-sends]
  schedule = "0 * * * *"

# Account graph + memory ingestion (Phase 3, plan §5.3) — turns lead_messages and terminal
# revenue_events into embedded memory. Every pass is idempotent via account_memory_source_uidx, so
# a missed tick costs latency and nothing else. Every 30 min: the work is bounded per tick
# (INGEST_BATCH_SIZE) and each row costs an embedding call, so a tighter interval buys nothing but
# provider spend. Staging drives this via run-account-memory.ts.
[functions.process-account-memory]
  schedule = "*/30 * * * *"

# Integration Scenario Library — outbound "Handoff" push drain (every 10 minutes, mirrors the
# discovery worker) + inbound feedback loop draining via process-webhook-events. Suppression
# sync pulls existing-customer domains from the CRM daily. docs/integration-scenario-library-plan.md.
[functions.process-scenario-jobs]
  schedule = "*/10 * * * *"
[functions.suppression-sync]
  schedule = "0 4 * * *"
# US-GOV-2.1.1: Daily digest for stale pending HITL actions — 09:00 UTC every day
[functions.pending-actions-digest]
  schedule = "0 9 * * *"

# US-GOV-3.3.1: Monthly bias statistical sampling — 1st of month at 06:00 UTC
[functions.bias-sampling]
  schedule = "0 6 1 * *"

# US-GOV-3.3.1: Quarterly bias prompt review reminder — 1st Jan/Apr/Jul/Oct at 08:00 UTC
[functions.quarterly-bias-reminder]
  schedule = "0 8 1 1,4,7,10 *"

# US-SMM-2.4.1: Draft horizon gap-fill — HOURLY, on the hour.
#
# Was 06:00 UTC daily. That made the assistant look broken: nothing watches for gaps appearing, so
# deleting or rejecting a batch of drafts left the Review Queue empty for up to 24 hours with no
# sign anything would happen.
#
# Hourly is safe to run because enqueueScheduleGapFill is genuinely idempotent — it counts existing
# posts in the window AND in-flight queued/processing jobs before deciding a slot is uncovered, so
# repeat runs fill only real deficits and never double-book a slot. It therefore enqueues the same
# total number of jobs as the daily run did; they just arrive sooner. A fully-covered assistant
# costs two queries and exits.
#
# On the hour deliberately: :00 coincides with the */10 drain tick, so this rides an existing
# compute window rather than waking Neon on its own. (It now shares 05:00 with blog-horizon-fill
# once a day — acceptable, since blog is daily and low-volume.)
[functions.draft-horizon-fill]
  schedule = "0 * * * *"

# Blog Autopilot: daily long-form horizon gap-fill — 05:00 UTC, an hour ahead of the social
# gap-fill above so the two heavy top-ups don't contend for the same Neon compute window.
# The worker drains the resulting queue every 10 minutes (long-form is slower and lower-volume
# than social, which drains every minute).
[functions.blog-horizon-fill]
  schedule = "0 5 * * *"
[functions.process-blog-jobs]
  schedule = "*/10 * * * *"

# US-SMM (AC7): Periodic conversion-post scheduler — daily 07:00 UTC; enqueues at most one
# conversion post per eligible assistant per 7 days (see schedule-conversion-posts.ts).
[functions.schedule-conversion-posts]
  schedule = "0 7 * * *"

# Epic 2 US5: Autonomous AI media suggestions — daily 07:00 UTC; drafts copy + AI media into the
# AI review queue for assistants that opted in, within their monthly autonomous credit cap.
[functions.autonomous-media-suggestions]
  schedule = "0 7 * * *"

# Epic 3 US8: AI approvals email digest — daily 08:00 UTC; emails opted-in workspaces a summary of
# pending AI drafts (daily, or weekly on Mondays). Sends nothing when the queue is empty.
[functions.ai-approvals-digest]
  schedule = "0 8 * * *"

# US-SMM-2.4.2's check-review-urgency (red-zone alerts + missed-post detection, */15) was REMOVED.
# Both halves measured a deadline against a DRAFT's publish_date — but a draft's date is only a
# proposal until someone presses Schedule (see src/config/post-status.ts), so it emailed "post due
# in 3h" about posts that were never committed, then expired them to 'missed'. Drafts now simply
# wait in the Review Queue; ai-approvals-digest above is what tells you they're waiting.

# US4 — Offline email fallback for unseen urgent notifications — every 15 minutes
[functions.notification-email-fallback]
  schedule = "*/15 * * * *"

# US-SMM-3.1.1: Process queued content generation jobs — every 10 minutes.
# NOTE: all the every-10-min queue drainers/publishers are deliberately ALIGNED to the same
# */10 cadence (not staggered) so they fire in one batch and leave a ~9-min idle window, letting
# Neon autosuspend between ticks. Neon bills by active compute time, and its quota is project-wide,
# so an always-on minute-cron here silently drains the allowance production shares. See the
# staging outage 2026-07-11 (Netlify Clockwork ran these every minute → Neon compute quota hit).
[functions.process-content-jobs]
  schedule = "*/10 * * * *"
  timeout = 26

# Epic 1, US1: synchronous AI image generation submits to Fal and polls until the images
# are ready. Raise the timeout to Netlify's synchronous max so a slow Flux-2 run completes
# instead of being killed mid-poll (raw 502). The poll budget in fal-gateway stays under this.
[functions.generate-ai-image]
  timeout = 26

# Assistant chat. One turn is: resolve the tenant, read the assistant + org + history, persist
# the user's message, call Claude, then persist the reply and any Data Hub records — and on the
# FIRST turn of a conversation it also creates the session and often wakes a suspended Neon
# compute (see the autosuspend note above). That does not reliably fit in Netlify's default 10s,
# and being killed mid-call produces a raw 502 with no JSON body — which the chat UI could only
# report as "Something went wrong", since the orchestrator's own failure path never ran.
#
# Reported from "Talk it through in chat" in the post editor, which is the worst case by
# construction: it opens a brand-new session and sends a "write me a post" prompt immediately,
# so the whole cold path is inside one budget. Same remedy as generate-ai-image above.
[functions.chat-orchestrator]
  timeout = 26

# Conversations tab. `list` and `get` are cheap reads, but the "Send the next chase now" action
# runs the outreach-sequence worker INLINE and awaits it — one LLM call to draft the follow-up plus
# one mail-API call to send it, inside the worker's own 20s wall-clock budget (WORKER_BUDGET_MS).
# At the default timeout the send would be cut off mid-flight and the user told nothing happened
# while an email went out anyway. Raised to Netlify's synchronous maximum, which sits above that
# budget on purpose so the worker stops itself cleanly rather than being killed.
[functions.lead-threads]
  timeout = 26

# US-SMM-3.2.2: Nightly Meta/Instagram token refresh — 02:00 UTC every day
[functions.refresh-meta-tokens]
  schedule = "0 2 * * *"

# Task 4: Silent X (Twitter) + LinkedIn token refresh — every 30 min (X tokens last ~2h)
#
# At :07/:37 rather than :00/:30, and this one is worth NOT batching with the drainers below.
# X rotates its refresh token on every use: between the moment X retires the old token and the
# moment we store the replacement, the only copy lives in the function's memory. A failed DB write
# in that window destroys the connection outright (it did, on 2026-08-04 — see the taxonomy in
# refresh-social-tokens.ts). :00 and :30 are exactly where the CONNECT_TIMEOUTs cluster, so this
# was rotating credentials at the least reliable moment on the clock.
#
# :07 is deliberate, not arbitrary: publish-blog-posts (*/5) has just run at :05, so Neon compute
# is warm and this rides that window rather than paying its own cold start.
[functions.refresh-social-tokens]
  schedule = "7,37 * * * *"

# Proactive refresh for workspace_integrations Google OAuth tokens (YouTube, Gmail, Search
# Console) — every 30 min so a ~1h token stays warm and a dead refresh grant surfaces before
# the next use rather than at publish time.
[functions.refresh-workspace-tokens]
  schedule = "*/30 * * * *"

# Audience block (assistant-detail): keep every workspace's follower/subscriber counts warm — every 4
# hours, MATCHING CACHE_TTL_MS in src/utils/follower-counts.ts. Those two must move together: a
# schedule slower than the TTL leaves gaps where the page falls back to fetching on load, and one
# faster just burns third-party quota. Without this cron the counts refresh only when someone opens the
# page, so a workspace nobody visits shows arbitrarily stale figures. Runs at :20 to stay clear of the
# :00 pile-up (poll-goal-telemetry and friends), since this one fans out to every workspace's APIs.
[functions.refresh-follower-counts]
  schedule = "20 */4 * * *"

# US-STOR-1.1.2 AC7: Nightly orphaned file cleanup — 03:00 UTC every day
[functions.storage-lifecycle-cleanup]
  schedule = "0 3 * * *"

# Review Queue Archive lifecycle: hard-delete rejected posts past their 30-day window — 04:00 UTC daily
[functions.archive-cleanup]
  schedule = "0 4 * * *"

# Lead Generator retention: move leads that sat in Outreach ▸ Review or ▸ Archived for 30 days into
# the retained "Deleted" state — 04:45 UTC daily, in the same part of the night as the other two
# lifecycle sweeps (04:00 archive-cleanup, 04:30 purge-archived-assistants) so a bad night is one
# stretch of log to read rather than three.
#
# ⚠️ Despite the name this sweep DELETES NOTHING. It stamps assistant_records.data.retention and
# leaves every row, every link and every discovery record in place — see the function header for
# why a hard delete is the wrong shape for a lead specifically.
[functions.lead-retention-sweep]
  schedule = "45 4 * * *"

# Lead Generator deep enrichment: re-read leads whose intel has gone stale, so a rating is not
# frozen at whatever the first search-result snippet said — 05:30 UTC daily.
#
# ⚠️ DEFAULT OFF (LEAD_ENRICH_SWEEP_ENABLED), and it is the ONLY cron here that spends money with
# nobody watching: up to four searches plus a model call per lead. The schedule being present does
# not start the spending; the env var does. Runs AFTER the retention sweep at 04:45 so a lead that
# was going to be moved out of Outreach tonight is moved first, rather than being researched at
# cost and then dropped an hour later.
[functions.lead-enrichment-sweep]
  schedule = "30 5 * * *"

# US4: content_assets retention — purge the R2 objects of posted/rejected media past their window.
# 05:00 UTC daily, AFTER archive-cleanup (04:00), because that job is what hands media over: it
# releases a departing post's assets, and this one reclaims the bytes.
#
# The function's header claimed "every 6 hours" from the day it was written, but it was never listed
# here, so it had NEVER run — which is why no content asset had ever been purged. Its own two bugs
# (deleting from an unconfigured S3, and stamping purged_at regardless) were latent for the same
# reason. Both are fixed; this line is what makes the reclaimer actually exist.
[functions.content-retention]
  schedule = "0 5 * * *"

# Issue #191: hard-delete archived assistants past their 14-day reinstate window — 04:30 UTC daily
[functions.purge-archived-assistants]
  schedule = "30 4 * * *"

# US-SMM-3.3.1/3.3.2: Publish due Instagram posts — every 10 minutes (aligned; see process-content-jobs note)
[functions.publish-instagram]
  schedule = "*/10 * * * *"

# Publish due LinkedIn & X posts — every 10 minutes (non-Instagram social publisher)
[functions.publish-social-posts]
  schedule = "*/10 * * * *"

# Publish due Facebook Page posts — every 10 minutes (piggybacks on the Meta connection)
[functions.publish-facebook]
  schedule = "*/10 * * * *"

# Drain inbound webhook events (intake → sandbox → connector handlers) — every 10 minutes
[functions.process-webhook-events]
  schedule = "*/10 * * * *"

# US-LEGAL-1.5: 14-day pre-renewal email reminder — 07:00 UTC every day
[functions.renewal-reminder]
  schedule = "0 7 * * *"

# US-ONB-2.1.2: Hourly onboarding reminder emails (24h + 72h after signup, no plan)
[functions.send-onboarding-reminders]
  schedule = "0 * * * *"

# Abandoned assistant-draft cleanup — daily 00:00 UTC. Sends the 23-day re-engagement
# nudge and deletes drafts inactive for 30+ days.
[functions.cleanup-abandoned-drafts]
  schedule = "0 0 * * *"

# US-SMM-PERF: Pull Instagram media insights for recently-published posts — every 6 hours.
# Insights keep changing for days after publish, so we re-fetch a rolling 30-day window.
[functions.ingest-instagram-insights]
  schedule = "0 */6 * * *"

# Same for Facebook Page posts. Offset 30 minutes from the Instagram run rather than sharing the
# slot: both hit the same Graph app, and Meta rate-limits per app, so overlapping the two batches
# is how you turn two comfortable runs into two throttled ones.
[functions.ingest-facebook-insights]
  schedule = "30 */6 * * *"

# SMART Goals AC4.1.1: poll current metric values for active goals — hourly. Each goal is
# throttled to its tier cadence (premium hourly, others daily) inside the worker.
[functions.poll-goal-telemetry]
  schedule = "0 * * * *"

# SMART Goals AC4.2.2: collapse the previous day's goal telemetry to one close-of-day point — 00:00 UTC.
[functions.rollup-goal-telemetry]
  schedule = "0 0 * * *"

# SMART Goals US3.3: autonomous optimizer — rewrite allowed brief params for off-track goals — 04:00 UTC daily.
[functions.autonomous-goal-optimizer]
  schedule = "0 4 * * *"

# Phase 5a §7: the Strategy Agent — cluster the human edits made in the Review Queue and propose one
# playbook change per assistant, plus the expiry sweep. Mondays 05:00 UTC.
#
# WEEKLY, not daily, and that is the design rather than thrift: the sample unit is a human edit, so
# a daily run would spend a model call to rediscover the same five edits six days running. It also
# matches the cadence a user can actually absorb — one proposal to read, not seven.
#
# Offset an hour after autonomous-goal-optimizer so the two never contend for the model gateway.
#
# ⚠️ THIS ENTRY POINT IS A DISPATCHER, NOT THE WORKER, and it needs no timeout raise because of it.
# One org costs ~50 seconds — almost all of it the model rewriting the playbook (measured on staging
# 2026-08-03: cold start 17:40:50, proposal written 17:41:39). A scheduled function gets 10s by
# default and 26s at the absolute maximum, so running the work here was killed on every tick. It
# hands off to autonomous-strategy-agent-background (15-minute budget) with an AWAITED fetch and
# returns 202. Do not "simplify" this back into one function.
#
# ⚠️ Netlify fires scheduled functions ONLY on the production deploy. Staging is a branch deploy, so
# this never runs there — .github/workflows/staging-crons.yml pokes run-strategy-agent
# instead, which dispatches the same worker. The two must stay in step.
[functions.autonomous-strategy-agent]
  schedule = "0 5 * * 1"

# Campaign Assistant autonomous run — scenarios 1 and 2 of docs/campaign-orchestrator-plan.md §4.
# Proposes 'escalation' (a post well ahead of the account average) and 'halt' (a saved search whose
# results have gone cold), and expires decisions whose evidence has aged out.
#
# ⚠️ NOT a dispatcher, unlike autonomous-strategy-agent above, and it does not need to be. Every
# number is a COUNT or an AVG with no model call, so a run finishes inline in well under the default
# budget. Do not add a background hop for symmetry — an un-awaited handoff is how jobs strand.
#
# DAILY rather than weekly: the halt trigger reads a 24-hour window, so a weekly run would miss six
# days out of seven of exactly the signal it exists to catch. 04:00 UTC keeps it clear of the 05:00
# strategy run and the 06:00 content crons.
#
# ⚠️ Netlify fires scheduled functions ONLY on the production deploy. Staging is a branch deploy, so
# this never runs there — .github/workflows/staging-crons.yml pokes run-campaign-agent
# instead, which calls the same function. The two must stay in step.
[functions.autonomous-campaign-agent]
  schedule = "0 4 * * *"

# Campaign order reconciliation — the RETURN path for the same feature. Moves orders off 'issued'
# once the work they commissioned has actually been drafted, approved or turned down, releases any
# order chained behind a delivered one, and finishes campaigns that have passed the end date the
# user set. Until this existed every campaign order read "With the assistant" for ever and
# campaigns.status could never reach 'finished'.
#
# A SEPARATE function from the agent above, deliberately. That one proposes and must never act;
# this one only records what already happened. Merging them would make "the autonomous proposer
# never places an order" a claim qualified by a flag rather than a property of the file — see the
# header of src/utils/campaign-reconciler.ts.
#
# HOURLY. Drafting takes minutes and approval takes hours or days, so a tighter loop would only add
# invocations and Neon wake-ups (the compute quota is PROJECT-WIDE — see the 2026-07-11 staging
# outage); a looser one would leave the Orders tab stale after the user clicks Approve. On the hour,
# joining the existing batch so the compute can still autosuspend in the gaps.
#
# ⚠️ Netlify fires scheduled functions ONLY on the production deploy. Staging is a branch deploy, so
# this never runs there — .github/workflows/staging-crons.yml pokes run-campaign-reconciler
# instead, which calls the same function. The two must stay in step.
[functions.reconcile-campaigns]
  schedule = "0 * * * *"
