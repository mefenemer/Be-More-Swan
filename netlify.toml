  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/TODO.md"
  to = "/404.html"
  status = 404
  force = true

# Brand transition (US5.2 / AC5.2): permanent 301 from the legacy domain to Be More Swan.
# Effective once both aura-assist.com and bemoreswan.com are attached to the Netlify site
# and DNS (AC5.1, external) points at Netlify.
[[redirects]]
  from = "https://aura-assist.com/*"
  to = "https://bemoreswan.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.aura-assist.com/*"
  to = "https://bemoreswan.com/:splat"
  status = 301
  force = true

# US-HELP-1.1.1 AC14: canonical URL aliases for the help centre
[[redirects]]
  from = "/help"
  to   = "/help.html"
  status = 301

[[redirects]]
  from = "/support"
  to   = "/help.html"
  status = 301

# /faq belongs to the PUBLIC marketing FAQ, not the help centre. It used to 301 to /help.html,
# which meant the most guessable + shareable URL for faq.html landed prospects on the internal
# Help Center — no nav, no footer, no pricing link, and a "Go to Workspace" CTA aimed at existing
# customers. sitemap.xml submits /faq.html to search engines, so the old redirect also fought the
# sitemap. /help and /support still point at the help centre; only /faq moved.
[[redirects]]
  from = "/faq"
  to   = "/faq.html"
  status = 301

# Agency attribution badge deep links. src/utils/attribution.ts builds badge URLs as
# /powered-by/<org-slug> and workspace.html shows the customer that exact URL to copy — but
# nothing routed it. There is no /powered-by/ directory, so every badge issued to every customer
# resolved to Netlify's 404 and the co-branded page was unreachable in production.
#
# MUST be status 200 (rewrite), not 301. powered-by.html reads the slug off the last path segment
# of window.location.pathname, and only a rewrite leaves the browser's URL as /powered-by/<slug>;
# a 301 to /powered-by.html would discard the slug and land every visitor on the generic
# explainer — the page would load, look fine, and silently lose the attribution.
#
# Placement is safe: Netlify matches top-to-bottom and nothing above this matches /powered-by/.
# The X-Robots-Tag rule for "/powered-by*" further down already covers these deep links, so the
# per-agency variants stay out of the index (verified on staging: the deep link returns
# x-robots-tag: noindex, nofollow).
#
# ⚠️ ":slug" MATCHES ONE PATH SEGMENT — do not "simplify" this back to a "/*" splat.
# A splat also swallows /powered-by/components/nav.html and /powered-by/anything/else.html, and
# answers them with this page. That is not hypothetical: the first version of this rule used "/*",
# and because powered-by.html fetched its nav and footer with DOCUMENT-RELATIVE paths, the page
# resolved them against /powered-by/<slug>/ and injected a copy of ITSELF into its own nav
# placeholder — three nested copies, no nav, no footer, on every badge link.
#
# powered-by.html now uses root-relative paths, which is the real fix; this narrower rule is the
# second line of defence so a future relative path cannot resurrect the same failure. Note it does
# NOT protect single-segment assets — /powered-by/style.css is one segment and would still match —
# so the "keep every path absolute" rule in powered-by.html's <head> is the one that matters.
[[redirects]]
  from = "/powered-by/:slug"
  to   = "/powered-by.html"
  status = 200

# Phase 1 External Integrations: pretty /api/* routes for the OAuth router and the
# generic action-sync endpoint. Rewrites (status 200) — the original path survives in
# event.rawUrl, which oauth-integrations.ts parses for :provider/:action; provider
# query params (?code=&state=) pass through untouched because `to` carries no query.
[[redirects]]
  from = "/api/oauth/*"
  to = "/.netlify/functions/oauth-integrations"
  status = 200

[[redirects]]
  from = "/api/actions/sync"
  to = "/.netlify/functions/sync-action"
  status = 200

# Meta Platform compliance callbacks for BOTH Meta apps — /api/meta/threads/* and
# /api/meta/facebook/* (uninstall + data deletion) — plus the public deletion-status page. Meta
# calls these unauthenticated server-to-server; meta-callbacks.ts verifies signed_request against
# the secret belonging to the app named in the path, so the splat must keep the segment intact.
[[redirects]]
  from = "/api/meta/*"
  to = "/.netlify/functions/meta-callbacks"
  status = 200

# Integration Scenario Library: browse/activate recipes + read execution logs. The original
# /api/integrations/:resource path survives in event.rawUrl, which integration-scenarios.ts parses.
[[redirects]]
  from = "/api/integrations/*"
  to = "/.netlify/functions/integration-scenarios"
  status = 200

# Autonomous Content Engine (US 3.1): public, read-only native-widget API. Rewrite (status 200) —
# the original /api/widget/:key/:resource path survives in event.rawUrl, which widget-api.ts parses.
[[redirects]]
  from = "/api/widget/*"
  to = "/.netlify/functions/widget-api"
  status = 200

# Autonomous Content Engine (US 1.3): per-widget XML sitemap. MUST precede the /b/* catch-all below —
# Netlify evaluates redirects top-to-bottom, first match wins, so without this a sitemap request would
# fall through to blog-page and 404 (no post has the slug "sitemap.xml").
[[redirects]]
  from = "/b/:key/sitemap.xml"
  to = "/.netlify/functions/blog-sitemap"
  status = 200

# Autonomous Content Engine (US 1.3): server-rendered blog permalink. Rewrite (status 200) — the
# original /b/:key/:slug path survives in event.rawUrl, which blog-page.ts parses. This is the
# crawler-facing, indexable, shareable URL the hash-routed Shadow-DOM widget cannot provide.
[[redirects]]
  from = "/b/*"
  to = "/.netlify/functions/blog-page"
  status = 200

# Stripe webhook: stable public path so the Stripe endpoint URL isn't tied to Netlify's internal
# /.netlify/functions/ path. Rewrite (status 200) — a 3xx would break delivery because Stripe does
# NOT follow redirects. MUST be configured on the apex host (bemoreswan.com); www 308-redirects to
# apex and would fail. Set the Stripe endpoint to https://bemoreswan.com/api/stripe/webhook.
[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[build]
  # Rebuild the Tailwind stylesheet from input.css on every deploy so style.css can never
  # drift from the markup (a stale committed style.css silently drops classes and breaks layouts).
  #
  # build:seo-html rewrites the published HTML for crawlers: it inlines components/footer.html
  # into the indexable marketing pages and generates faq.html's FAQPage JSON-LD from the questions
  # actually rendered there. It runs HERE, in the deploy container, against a fresh checkout — the
  # transformed HTML is published and never committed, so a local checkout keeps the runtime-fetch
  # behaviour and there is one source of truth for the footer. It exits non-zero if any injection
  # fails to match, which fails the build rather than publishing a page that quietly lost its
  # structured data. Run `npm run build:seo-html` locally to inspect the output (it is idempotent;
  # `git checkout -- .` afterwards).
  command = "npm run build:css:prod && npm run build:version && npm run build:seo-html"
  functions = "netlify/functions"

# ⚠️ PIN THE RUNTIME. Unset, the build and the Lambda runtime take whatever Netlify defaults to,
# which is NOT the version anyone runs locally — and that gap hides a whole class of bug.
#
# What it cost us on 2026-08-04: `marked` is ESM-only, and a static import of it compiles to
# `require()` in the CJS function bundle. Node **22.12+ permits require() of ESM; earlier versions
# throw ERR_REQUIRE_ESM at module load**. Local dev was on Node 26 (fine), the deploy runtime was
# older (fatal), so publish-blog-posts sat in a crash loop for over a day while every local check
# passed. Nothing you can run on your machine reproduces a difference you have not pinned.
#
# 22 because it is the active LTS as of this pin. Node 18 (EOL Apr 2025) and 20 (EOL Apr 2026) are
# both past end-of-life — this pin is therefore an UPGRADE off an unsupported runtime, not merely a
# lock, so treat a change to it as a deploy to validate on staging first.
#
# Keep this in step with .nvmrc and package.json `engines` — .nvmrc drives local `nvm use`, and all
# three exist so the versions cannot silently diverge again. See tests/esm-only-imports.test.ts.
[build.environment]
  NODE_VERSION = "22"
[dev]
  functions = "netlify/functions"
[functions]
node_bundler = "esbuild"

# HTML must always be revalidated, never served stale from the browser/CDN cache.
# Our pages carry their JS inline (admin.html, workspace.html, …), so a cached HTML
# document = stale JS = old behaviour after a deploy (the "stale-cache trap").
# `no-cache` still lets the browser store the file but forces a revalidation (cheap
# ETag/304) before reuse, so every load picks up the latest deploy. Static assets
# (style.css, *.js fetched separately) keep their own cache-busting (?v=).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# ── Search-engine indexing policy ───────────────────────────────────────────────
# robots.txt deliberately carries no Disallow prefix list, because public and private page
# names collide on their prefixes (assistants.html is public marketing; assistant-chat.html
# is not). It defers instead to per-page noindex — which is this block.
#
# X-Robots-Tag rather than a <meta> tag, for two reasons:
#   1. Many paths below are HTML *fragments* with no <head> for a meta tag to live in.
#   2. Netlify serves every page at BOTH /foo.html and /foo. The trailing splat covers both
#      forms; it also covers same-named assets (/assets* catches assets.js), which is why
#      these rules set ONLY X-Robots-Tag — inert on a script, and it leaves the /*.html
#      Cache-Control rule above untouched (Netlify merges rules that set different headers,
#      and resolves by specificity only when two rules set the SAME header).
#
# This inverts an allow-list. Everything indexable is: / index about pricing contact faq
# trust privacy terms_of_service data-deletion help assistants licenses register — those 13
# carry <link rel=canonical> + Open Graph tags and are the entries in sitemap.xml. When you
# add a public marketing page, add it to sitemap.xml; when you add an app page, add it here.

# Workspace shell plus the view fragments it injects. These are served standalone at their
# own URLs (Netlify publishes the repo root), but they are not pages — several have no
# <head> at all, so a meta robots tag would have nowhere valid to live.
[[headers]]
  for = "/workspace*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/billing*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/calendar*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
