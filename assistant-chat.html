<!DOCTYPE html>
<html lang="en">
<head>
  <script src="./auth-check.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with your Assistant | Be More Swan</title>
  <link href="./style.css" rel="stylesheet">
  <!-- Markdown rendering for assistant replies (same pair as workspace.html) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="icon" href="/favicon/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/manifest.json">
</head>
<body class="font-sans text-gray-800 antialiased bg-gray-50 flex flex-col min-h-screen overflow-x-hidden">

<!-- Nav -->
<div id="nav-placeholder"></div>

<main class="grow flex flex-col max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

  <!-- Header: back link + assistant identity -->
  <nav class="flex mb-4 text-sm font-medium text-gray-500">
    <a href="workspace.html" class="hover:text-emerald-700 transition-colors flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Back to Workspace
    </a>
  </nav>

  <!-- US-LEGAL-3.1: EU AI Act Art.50 — persistent AI interaction disclosure (non-dismissable) -->
  <div id="ai-interaction-disclosure" role="note" aria-label="AI system disclosure"
       class="flex items-center gap-2 mb-4 px-3 py-2 rounded-lg bg-blue-50 border border-blue-200 text-xs text-blue-700 font-medium">
    <svg class="w-3.5 h-3.5 shrink-0 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a.75.75 0 000 1.5h.253a.25.25 0 01.244.304l-.459 2.066A1.75 1.75 0 0010.747 15H11a.75.75 0 000-1.5h-.253a.25.25 0 01-.244-.304l.459-2.066A1.75 1.75 0 009.253 9H9z" clip-rule="evenodd"/>
    </svg>
    <span>You are interacting with an AI assistant. AI-generated content may be inaccurate — always review before sending or publishing.</span>
  </div>

  <div id="chat-header" class="hidden bg-white rounded-t-2xl border border-b-0 border-gray-200 shadow-sm px-5 py-4 items-center gap-3">
    <div class="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center text-xl shrink-0">💬</div>
    <div class="min-w-0 grow">
      <p id="chat-assistant-name" class="font-bold text-gray-900 truncate"></p>
      <p id="chat-assistant-role" class="text-xs text-gray-500 truncate"></p>
    </div>
    <!-- Past conversations (chat-history-panel.js) — same drawer the in-SPA modals use. -->
    <button type="button" id="chat-history-btn" aria-expanded="false" title="Past conversations"
      class="shrink-0 px-2.5 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-xs font-bold text-gray-700 cursor-pointer">History</button>
  </div>

  <!-- Chat mounts here; bounded height so the transcript scrolls, not the page -->
  <div id="chat-shell" class="hidden relative grow min-h-[24rem]" style="height: calc(100vh - 21rem);">
    <div id="chat-root" class="absolute inset-0 bg-white rounded-b-2xl border border-gray-200 shadow-sm overflow-hidden"></div>
    <!-- Slides in over the transcript; transform (not display) keeps its scroll position. -->
    <div id="chat-history"
         class="absolute top-0 left-0 bottom-0 w-[270px] max-w-[80%] bg-white border-r border-gray-200 rounded-bl-2xl shadow-lg z-[2] transition-transform duration-200 overflow-hidden"
         style="transform:translateX(-102%)"></div>
  </div>

  <!-- Loading / error states -->
  <div id="chat-loading" class="bg-white rounded-2xl border border-gray-200 shadow-sm p-12 text-center text-gray-500">
    Loading your assistant…
  </div>
  <div id="chat-error" class="hidden bg-white rounded-2xl border border-gray-200 shadow-sm p-12 text-center">
    <div class="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center text-2xl mx-auto mb-3">🤔</div>
    <p class="font-bold text-gray-900 mb-1">We couldn't open this conversation</p>
    <p id="chat-error-detail" class="text-sm text-gray-500 mb-6">The assistant could not be found.</p>
    <a href="workspace.html" class="inline-block px-6 py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-lg transition">Back to Workspace</a>
  </div>

</main>

<script src="./mobileMenu.js"></script>
<script src="/src/components/disruptive-ui-registry.js"></script>
<script src="/src/components/assistant-starter-prompts.js"></script>
<script src="/src/components/chat-session.js"></script>
<!-- "Past conversations" drawer shared by every chat surface — lists threads from
     list-chat-sessions.ts, archives/restores via archive-chat-session.ts. -->
<script src="/src/components/chat-history-panel.js"></script>
<script>
async function loadComponent(id, path) {
  try {
    const r = await fetch(path);
    if (r.ok) document.getElementById(id).innerHTML = await r.text();
  } catch {}
}

function showChatError(detail) {
  document.getElementById('chat-loading').classList.add('hidden');
  document.getElementById('chat-error').classList.remove('hidden');
  if (detail) document.getElementById('chat-error-detail').textContent = detail;
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadComponent('nav-placeholder', './components/nav.html');
  if (typeof setupMobileMenu === 'function') setupMobileMenu();

  const params = new URLSearchParams(window.location.search);
  let assistantId = Number(params.get('assistantId')) || null;
  let sessionId = Number(params.get('sessionId')) || null;
  // ?new=1 opts out of the resume below and starts a fresh thread.
  const forceNew = params.get('new') === '1';

  if (!sessionId && (!Number.isInteger(assistantId) || assistantId <= 0)) {
    showChatError('No assistant was specified — open a conversation from your workspace.');
    return;
  }

  // Continuity (matches assistant-chat-modal.js): arriving with only an assistantId resumes
  // that assistant's newest active thread rather than minting a new one on every visit. A
  // lookup failure resolves to null, which simply starts a new conversation.
  let autoResumed = false;
  if (!sessionId && !forceNew && assistantId) {
    try {
      const res = await fetch(
        `/.netlify/functions/list-chat-sessions?limit=1&status=active&aiAssistantId=${assistantId}`);
      if (res.ok) {
        const rows = (await res.json()).sessions || [];
        if (rows.length) { sessionId = rows[0].id; autoResumed = true; }
      }
    } catch { /* no history — fall through to a new conversation */ }
  }

  // Continuing a thread: hydrate the transcript (and the assistant identity) from the
  // history endpoint — it re-verifies org ownership server-side via requireTenant.
  let assistantName = null;
  let assistantRole = null;
  let assistantRoleKey = null;
  let initialMessages = [];
  let sessionStatus = null;   // 'active' | 'archived' | null (a brand-new conversation)

  if (sessionId) {
    let data = null;
    try {
      const res = await fetch(`/.netlify/functions/get-chat-session?chatSessionId=${sessionId}`);
      if (res.ok) data = await res.json();
    } catch { /* handled below */ }

    if (!data?.session) {
      // An auto-resumed thread that won't hydrate (archived or deleted since the lookup) is
      // not an error the user asked for — drop to a new conversation. An explicit ?sessionId=
      // still errors, exactly as it did before.
      if (!autoResumed) {
        showChatError('This conversation could not be found in your workspace.');
        return;
      }
      sessionId = null;
    } else {
      assistantId = data.session.aiAssistantId;
      assistantName = data.session.assistantName;
      assistantRole = data.session.assistantRole;
      initialMessages = data.messages || [];
      sessionStatus = data.session.status;
    }
  }

  if (!sessionId) {
    // New conversation: resolve the assistant's display identity (and confirm it
    // belongs to this org) from the workspace roster.
    let assistant = null;
    try {
      const res = await fetch('/.netlify/functions/get-assistants');
      if (res.ok) {
        const data = await res.json();
        assistant = (data.assistants || []).find((a) => a.id === assistantId) || null;
      }
    } catch { /* handled below */ }

    if (!assistant) {
      showChatError('This assistant could not be found in your workspace.');
      return;
    }
    assistantName = assistant.name;
    assistantRole = assistant.role;
    assistantRoleKey = assistant.roleKey;
  }

  document.getElementById('chat-assistant-name').textContent = assistantName;
  document.getElementById('chat-assistant-role').textContent = assistantRole || 'Digital Assistant';
  document.getElementById('chat-loading').classList.add('hidden');
  document.getElementById('chat-header').classList.remove('hidden');
  document.getElementById('chat-header').classList.add('flex');
  document.getElementById('chat-shell').classList.remove('hidden');

  window.ChatSession.mount({
    container: document.getElementById('chat-root'),
    assistantId,
    chatSessionId: sessionId,
    assistantName,
    roleKey: assistantRoleKey,
    initialMessages,
    // Authoritative: an archived thread is read-only wherever it was opened from. Derived from
    // the session's own status, not from which drawer tab was clicked.
    readOnly: sessionStatus === 'archived',
  });

  // ── History drawer ──────────────────────────────────────────────────────────────
  // This is a full page, so a pick is a navigation rather than an in-place re-mount — the URL
  // stays the honest record of which conversation is open, and Back works.
  const drawerEl = document.getElementById('chat-history');
  const historyBtn = document.getElementById('chat-history-btn');
  let historyPanel = null;

  function setDrawerOpen(open) {
    drawerEl.style.transform = open ? 'translateX(0)' : 'translateX(-102%)';
    historyBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    historyBtn.classList.toggle('bg-emerald-50', open);
    historyBtn.classList.toggle('text-emerald-800', open);
    if (open && historyPanel) historyPanel.refresh();
  }

  if (window.ChatHistoryPanel && assistantId) {
    historyPanel = window.ChatHistoryPanel.mount({
      container: drawerEl,
      assistantId,
      currentSessionId: sessionId,
      onSelect: (id) => { window.location.search = `?sessionId=${id}`; },
      onNew: () => { window.location.search = `?assistantId=${assistantId}&new=1`; },
    });
    historyBtn.addEventListener('click', () => {
      setDrawerOpen(drawerEl.style.transform === 'translateX(-102%)');
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && drawerEl.style.transform === 'translateX(0)') setDrawerOpen(false);
    });
  } else {
    historyBtn.classList.add('hidden');
  }
});
</script>
</body>
</html>
