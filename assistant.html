<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assistant | Be More Swan</title>
  <meta name="description" content="See what this Be More Swan digital assistant does for your business — how it works, its key features, screenshots and a short overview video.">
  <!-- This ?role= shell is the same document for every assistant, so it stays out of the index. The
       indexable copy of each live assistant is its own page (/ai-…), generated from this file by
       scripts/build-seo-html.mjs (Job 6), which removes this tag and adds a canonical. -->
  <meta name="robots" content="noindex, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Be More Swan">
  <meta property="og:image" content="https://bemoreswan.com/images/og-default.png">
  <meta name="twitter:card" content="summary_large_image">
  <link href="./style.css" rel="stylesheet">
  <script src="/site-theme.js"></script>
  <link rel="icon" href="/favicon/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/manifest.json">
  <!--
    assistant.html — the public, long-form page for ONE assistant (?role=<roleKey>), opened from the
    website's Assistant Library (assistants.html). Replaced the small detail pop-up there.

    Two sources, both DB-driven:
      • /.netlify/functions/master-assistants — name, tagline, description, key features,
        integrations, works-with, video (window.AssistantContent, shared with the library);
      • /.netlify/functions/assistant-showcase — the long form: overview, how it works, features
        with screenshots, FAQs (db/assistant-showcases.json → db/z-assistant-showcases.sql).
    A role with no showcase still renders, as the short version. Public: no auth-check.js.
  -->
  <style>
    .icon-blue   { background: #eff6ff; color: #2563eb; }
    .icon-purple { background: #f5f3ff; color: #7c3aed; }
    .icon-orange { background: #fff7ed; color: #ea580c; }
    .icon-teal   { background: #f0fdfa; color: #0d9488; }
    .icon-pink   { background: #fdf2f8; color: #db2777; }
    .icon-green  { background: #f0fdf4; color: #16a34a; }
    .icon-yellow { background: #fefce8; color: #ca8a04; }
    .icon-red    { background: #fef2f2; color: #dc2626; }
    .sc-video { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #111; border-radius: 1rem; overflow: hidden; }
    .sc-video video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .sc-feature { display: grid; gap: 1.5rem; align-items: center; }
    @media (min-width: 900px) {
      .sc-feature { grid-template-columns: 1fr 1.3fr; gap: 3rem; }
      .sc-feature.sc-flip > .sc-copy { order: 2; }
    }
    .sc-shot { display: block; width: 100%; border-radius: 0.875rem; border: 1px solid #e5e7eb; box-shadow: 0 20px 40px -20px rgba(31,30,27,.35); cursor: zoom-in; background: #fff; }
    .sc-steps { display: grid; gap: 1rem; }
    @media (min-width: 768px) { .sc-steps { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .sc-lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(17,17,17,.85); display: none; align-items: center; justify-content: center; padding: 1rem; cursor: zoom-out; }
    .sc-lightbox img { max-width: 100%; max-height: 92vh; border-radius: .75rem; }
    .sc-lightbox.is-open { display: flex; }
  </style>
  <!-- roleKey → /ai-… page map, filled at build. Loaded synchronously: the script below uses it to
       forward ?role= links before anything paints. -->
  <script src="/assistant-pages.js"></script>
  <script src="/waitlist-mode.js" defer></script>
  <script src="/visit-count.js" defer></script>
  <!-- The Mystery Shopper's free website check, mounted after the hero for that role only. -->
  <script src="/src/public/site-taster.js" defer></script>
</head>
<body class="font-sans text-gray-800 antialiased bg-gray-50 flex flex-col min-h-screen overflow-x-hidden">

<div id="nav-placeholder"></div>

<main class="grow w-full">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
    <a href="assistants.html" class="inline-flex items-center gap-1 text-sm font-medium text-gray-500 hover:text-emerald-700 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      All assistants
    </a>
  </div>

  <div id="sc-root" class="hidden"></div>

  <div id="sc-loading" class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-24 text-center text-gray-400 text-sm">Loading…</div>

  <div id="sc-error" class="hidden max-w-xl mx-auto px-4 py-24 text-center">
    <p class="text-2xl font-extrabold text-gray-900 mb-2">We couldn't find that assistant</p>
    <p class="text-gray-500 mb-6">It may have been renamed. Browse the library to find the one you want.</p>
    <a href="assistants.html" class="btn-primary inline-block px-6 py-3 font-bold rounded-xl">Meet the Assistants</a>
  </div>
</main>

<div id="sc-lightbox" class="sc-lightbox" role="dialog" aria-label="Screenshot" tabindex="-1"><img alt=""></div>

<div id="footer-placeholder"></div>

<script src="./mobileMenu.js"></script>
<script src="/src/public/assistant-content.js"></script>
<script>
(function () {
  const ICONS = {
    document: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>',
    smile: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>',
    megaphone: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>',
    globe: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>',
    chart: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>',
    lightning: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>',
    mail: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>',
    cog: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/>',
  };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // Only our own paths or https — the copy is admin-edited, and a javascript: URL in an href is XSS.
  const safeUrl = (u) => (/^(\/|https:\/\/)/.test(String(u || '')) ? String(u) : '');
  const check = '<svg class="w-5 h-5 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>';

  // A role's swan character, shown in the hero. Kept here, not in the showcase
  // JSON, so adding one ships with the deploy and needs no SQL run.
  const ILLUSTRATIONS = {
    social_media_manager: { src: '/images/assistants/social_media_manager/swan.jpg', alt: 'A pink swan in a headset and glasses holding a phone, surrounded by likes, comments and paper planes', width: 900, height: 900 },
    blog_writer: { src: '/images/assistants/blog_writer/swan.jpg', alt: 'A pink swan in a beret and glasses writing on a laptop, surrounded by floating article pages', width: 900, height: 900 },
    lead_qualifier: { src: '/images/assistants/lead_qualifier/swan.jpg', alt: 'A pink swan in goggles and a waistcoat holding a glowing magnet that pulls in contact cards, stars and a sales funnel', width: 900, height: 900 },
    mystery_shopper: { src: '/images/assistants/mystery_shopper/swan.jpg', alt: 'A pink swan detective in a hat, sunglasses and trench coat holding a magnifying glass and a shopping bag, surrounded by star ratings and checklists', width: 900, height: 900 },
    website_assistant: { src: '/images/assistants/website_assistant/swan.jpg', alt: 'A pink swan in a hard hat, hoodie and tool belt with wings spread among floating web page layouts and a cursor', width: 900, height: 900 },
    brand_designer: { src: '/images/assistants/brand_designer/swan.jpg', alt: 'A pink swan in a paint-splashed apron and colourful glasses holding a palette and stylus, surrounded by colour swatches, a colour wheel and type samples', width: 900, height: 900 },
    campaign_orchestrator: { src: '/images/assistants/campaign_orchestrator/swan.jpg', alt: 'A pink swan conductor in a tailcoat and bow tie waving a glowing baton, surrounded by a megaphone, emails, campaign plans and a rocket', width: 900, height: 900 },
    newsletter_editor: { src: '/images/assistants/newsletter_editor/swan.jpg', alt: 'A pink swan postie in a cap and satchel giving a thumbs up beside a glowing envelope, surrounded by paper planes and email reports', width: 900, height: 900 },
  };

  // A generated page (/ai-…) names its role in <meta name="bms-role">; this shell takes ?role=.
  const params = new URLSearchParams(location.search);
  const bakedRole = document.querySelector('meta[name="bms-role"]')?.content || '';
  const PAGES = window.BmsAssistantPages || {};
  // A role with its own page lives there now: forward before anything renders, keeping every other
  // parameter and the hash — the Mystery Shopper's emailed result link carries ?r=&t= and the
  // footer links to #free-website-check.
  if (!bakedRole && PAGES[params.get('role')]) {
    const slug = PAGES[params.get('role')];
    params.delete('role');
    const qs = params.toString();
    location.replace(`/${slug}${qs ? `?${qs}` : ''}${location.hash}`);
    return;
  }
  const pageHref = (roleKey) => (PAGES[roleKey] ? `/${PAGES[roleKey]}` : `assistant.html?role=${encodeURIComponent(roleKey)}`);

  let isLoggedIn = false;
  let waitlistOn = false;

  // The Mystery Shopper's page carries its free website check (src/public/site-taster.js). That check
  // is public whatever the role's catalogue status: while the role is Beta or Hidden an anonymous
  // visitor cannot see its details, so the page shows the check on its own instead of "not found" —
  // otherwise the emailed result link (…&r=&t=) would land on an error for everyone outside the beta.
  const TASTER_ROLE = 'mystery_shopper';
  function mountTaster(root, roleKey, c, headingTag) {
    const host = root.querySelector('#site-taster-host');
    if (host && window.BmsSiteTaster) {
      // cta() already returns the waitlist button while sign-ups are locked, so the result's button
      // always matches the page's own.
      window.BmsSiteTaster.mount(host, { ctaHtml: cta(roleKey, c, true), headingTag });
    }
  }

  // Same CTA rules as the library cards (assistants.html): customers hire from the workspace,
  // visitors pick a plan first (or join the waitlist while registration is locked), and a role
  // that isn't live yet only takes waitlist sign-ups.
  function cta(roleKey, c, big) {
    const cls = big ? 'px-6 py-3 text-base rounded-xl' : 'px-5 py-2.5 text-sm rounded-lg';
    if (c.comingSoon) return `<a href="/waitlist.html?role=${encodeURIComponent(roleKey)}" class="btn-primary inline-block font-bold ${cls}">Join the waitlist</a>`;
    if (isLoggedIn) return `<a href="workspace.html?view=catalog" data-hire="${esc(roleKey)}" class="btn-golive inline-block font-bold ${cls}">Hire ${esc(c.name)}</a>`;
    if (waitlistOn) return `<a href="/waitlist.html?role=${encodeURIComponent(roleKey)}" data-intent="${esc(roleKey)}" class="btn-primary inline-block font-bold ${cls}">Join the waitlist</a>`;
    return `<a href="pricing.html" data-intent="${esc(roleKey)}" class="btn-golive inline-block font-bold ${cls}">Get started</a>`;
  }

  function render(roleKey, c, sc) {
    const icon = `<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">${ICONS[c.iconKey] || ICONS.document}</svg>`;
    const video = c.video && safeUrl(c.video.url) ? c.video : null;
    const s = sc || {};
    const overview = Array.isArray(s.overview) ? s.overview : (c.description ? [c.description] : []);
    const highlights = Array.isArray(s.highlights) && s.highlights.length ? s.highlights : (c.keyFeatures || []);
    const steps = Array.isArray(s.steps) ? s.steps : [];
    const features = Array.isArray(s.features) ? s.features : [];
    const faqs = Array.isArray(s.faqs) ? s.faqs : [];
    const art = ILLUSTRATIONS[roleKey];
    // With a character, the swan takes the hero and the video moves down into How it works — unless
    // there are no steps to hold it, then the video keeps the hero.
    const heroArt = art && (!video || steps.length) ? art : null;
    const videoBlock = video ? `
            <div id="sc-video" class="sc-video shadow-2xl">
              <video controls playsinline preload="metadata" ${safeUrl(video.poster) ? `poster="${esc(safeUrl(video.poster))}"` : ''}>
                <source src="${esc(safeUrl(video.url))}" type="video/mp4">
              </video>
            </div>
            <p class="text-sm text-gray-500 mt-3 text-center">${esc(video.title || 'See it in action')}</p>` : '';
    const apps = (c.integrations || []).map((a) => AssistantContent.integrationChip(a)).join('');
    const peers = AssistantContent.resolveWorksWith(c.worksWith).map((p) => p.standalone
      ? `<span class="inline-flex items-center gap-1.5 bg-gray-100 border border-gray-200 rounded-full px-3 py-1 text-xs font-semibold text-gray-600">Works on its own</span>`
      : p.roleKey
        ? `<a href="${esc(pageHref(p.roleKey))}" class="inline-flex items-center gap-1.5 bg-emerald-50 border border-emerald-100 rounded-full px-3 py-1 text-xs font-semibold text-emerald-700 hover:bg-emerald-100">${esc(p.label)}</a>`
        : `<span class="inline-flex items-center bg-emerald-50 border border-emerald-100 rounded-full px-3 py-1 text-xs font-semibold text-emerald-700">${esc(p.label)}</span>`).join('');

    return `
    <!-- Hero -->
    <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16">
      <div class="grid gap-10 lg:grid-cols-2 items-center">
        <div>
          <div class="flex items-center gap-3 mb-5">
            <div class="w-12 h-12 rounded-xl icon-${esc(c.iconColor || 'blue')} flex items-center justify-center">${icon}</div>
            <div>
              <p class="text-xs font-bold uppercase tracking-wider text-gray-500">${esc(c.category || 'Digital assistant')}</p>
              ${c.comingSoon
                ? '<span class="inline-block mt-1 px-2.5 py-0.5 bg-amber-100 text-amber-700 rounded-full text-[11px] font-bold uppercase tracking-wider">Coming soon</span>'
                : '<span class="inline-block mt-1 px-2.5 py-0.5 bg-emerald-100 text-emerald-700 rounded-full text-[11px] font-bold uppercase tracking-wider">Available now</span>'}
            </div>
          </div>
          <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-900 leading-tight mb-4">${esc(c.name)}</h1>
          <p class="text-xl font-bold text-emerald-700 mb-6">${esc(s.headline || c.tagline || '')}</p>
          <ul class="space-y-2.5 mb-8">${highlights.map((h) => `<li class="flex items-center gap-2.5 text-gray-700 font-medium">${check}<span>${esc(h)}</span></li>`).join('')}</ul>
          <div class="flex flex-wrap items-center gap-3">
            ${cta(roleKey, c, true)}
            ${video ? '<a href="#sc-video" class="inline-flex items-center gap-2 px-5 py-3 font-bold text-gray-700 hover:text-emerald-700"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Watch the overview</a>' : ''}
          </div>
          ${c.comingSoon ? '' : '<p class="text-xs text-gray-400 mt-4">Included in every plan · You approve its work before anything goes out</p>'}
        </div>
        <div>
          ${heroArt
            ? `<img src="${esc(art.src)}" alt="${esc(art.alt)}" width="${art.width}" height="${art.height}" fetchpriority="high" decoding="async" class="w-full max-w-md mx-auto h-auto" style="mix-blend-mode: multiply">`
          : video ? videoBlock
          : features[0] && safeUrl(features[0].image)
            ? `<img src="${esc(safeUrl(features[0].image))}" alt="${esc(features[0].alt || '')}" class="sc-shot" data-zoom loading="eager">`
            : ''}
        </div>
      </div>
    </section>

    ${roleKey === TASTER_ROLE ? '<div id="site-taster-host"></div>' : ''}

    ${overview.length ? `
    <!-- Overview -->
    <section class="bg-white border-y border-gray-100">
      <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-6">What it does for you</h2>
        <div class="space-y-4 text-lg text-gray-600 leading-relaxed">${overview.map((p) => `<p>${esc(p)}</p>`).join('')}</div>
      </div>
    </section>` : ''}

    ${steps.length ? `
    <!-- How it works -->
    <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
      <h2 class="text-3xl font-extrabold text-gray-900 mb-8 text-center">How it works</h2>
      <ol class="sc-steps">${steps.map((st, i) => `
        <li class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
          <span class="flex items-center justify-center w-9 h-9 rounded-full bg-emerald-100 text-emerald-700 font-extrabold mb-4">${i + 1}</span>
          <p class="font-bold text-gray-900 mb-1.5">${esc(st.title)}</p>
          <p class="text-sm text-gray-600 leading-relaxed">${esc(st.body)}</p>
        </li>`).join('')}
      </ol>
      ${heroArt && video ? `<div class="max-w-4xl mx-auto mt-12">${videoBlock}</div>` : ''}
    </section>` : ''}

    ${features.length ? `
    <!-- Features -->
    <section class="bg-white border-y border-gray-100">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-16 space-y-16">
        <h2 class="text-3xl font-extrabold text-gray-900 text-center">Key features</h2>
        ${(() => { let side = 0; return features.map((f) => {
          // Rows with a screenshot alternate sides; a feature without one is a centred block, so it
          // never leaves an empty half-column.
          if (!safeUrl(f.image)) return `
          <div class="max-w-3xl mx-auto text-center">
            <h3 class="text-2xl font-extrabold text-gray-900 mb-3">${esc(f.title)}</h3>
            <p class="text-gray-600 leading-relaxed">${esc(f.body)}</p>
          </div>`;
          const flip = side++ % 2 === 1;
          return `
          <div class="sc-feature ${flip ? 'sc-flip' : ''}">
            <div class="sc-copy">
              <h3 class="text-2xl font-extrabold text-gray-900 mb-3">${esc(f.title)}</h3>
              <p class="text-gray-600 leading-relaxed">${esc(f.body)}</p>
            </div>
            <div><img src="${esc(safeUrl(f.image))}" alt="${esc(f.alt || f.title)}" class="sc-shot" data-zoom loading="lazy"></div>
          </div>`; }).join(''); })()}
      </div>
    </section>` : (c.keyFeatures || []).length ? `
    <section class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
      <h2 class="text-3xl font-extrabold text-gray-900 mb-6">Key features</h2>
      <ul class="space-y-3">${c.keyFeatures.map((f) => `<li class="flex items-start gap-2.5 text-gray-700">${check}<span>${esc(f)}</span></li>`).join('')}</ul>
    </section>` : ''}

    ${apps || peers ? `
    <!-- Integrations -->
    <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
      <div class="grid gap-6 md:grid-cols-2">
        ${apps ? `<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
          <h2 class="text-lg font-extrabold text-gray-900 mb-3">Connects with</h2>
          <div class="flex flex-wrap gap-1.5">${apps}</div>
        </div>` : ''}
        ${peers ? `<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
          <h2 class="text-lg font-extrabold text-gray-900 mb-3">Works with</h2>
          <div class="flex flex-wrap gap-1.5">${peers}</div>
        </div>` : ''}
      </div>
    </section>` : ''}

    ${faqs.length ? `
    <!-- FAQs -->
    <section class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">
      <h2 class="text-3xl font-extrabold text-gray-900 mb-6">Questions</h2>
      <div class="space-y-3">${faqs.map((f) => `
        <details class="bg-white border border-gray-200 rounded-xl shadow-sm group">
          <summary class="flex justify-between items-center font-semibold cursor-pointer list-none px-6 py-5 text-gray-900">
            <span>${esc(f.q)}</span>
            <svg class="w-5 h-5 text-gray-400 transition-transform group-open:rotate-180 shrink-0 ml-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </summary>
          <div class="px-6 pb-5 text-gray-600 text-sm leading-relaxed border-t border-gray-100 pt-4">${esc(f.a)}</div>
        </details>`).join('')}
      </div>
    </section>` : ''}

    <!-- Closing CTA -->
    <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
      <div class="bg-emerald-50 rounded-2xl p-8 border border-emerald-100 flex flex-col md:flex-row items-center justify-between gap-6">
        <div>
          <h2 class="text-2xl font-extrabold text-gray-900 mb-2">${c.comingSoon ? `The ${esc(c.name)} is on the way` : `Put the ${esc(c.name)} to work`}</h2>
          <p class="text-gray-600 max-w-xl">${c.comingSoon
            ? "Join the waitlist and we'll tell you the moment it's ready to hire."
            : 'Answer a few setup questions and it starts with the right context — most people are up and running in fifteen minutes.'}</p>
        </div>
        ${cta(roleKey, c, true)}
      </div>
    </section>`;
  }

  async function loadComponent(id, path) {
    try { const r = await fetch(path); if (r.ok) document.getElementById(id).innerHTML = await r.text(); } catch (e) { /* page still works */ }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    await loadComponent('nav-placeholder', './components/nav.html');
    loadComponent('footer-placeholder', './components/footer.html');
    if (typeof setupMobileMenu === 'function') setupMobileMenu();

    const roleKey = (bakedRole || params.get('role') || '').trim();
    try { isLoggedIn = (await fetch('/.netlify/functions/check-capacity')).ok; } catch (e) { /* visitor */ }
    if (!isLoggedIn && window.BmsWaitlist) { try { waitlistOn = await window.BmsWaitlist.isOn(); } catch (e) { /* off */ } }

    const [, sc] = await Promise.all([
      AssistantContent.load(),
      fetch(`/.netlify/functions/assistant-showcase?roleKey=${encodeURIComponent(roleKey)}`)
        .then((r) => (r.ok ? r.json() : {})).then((d) => d.showcase || null).catch(() => null),
    ]);
    const c = roleKey ? AssistantContent.get(roleKey) : null;
    document.getElementById('sc-loading').classList.add('hidden');
    // The crawler copy baked into a generated page (#sc-static) gives way to the live render, or to
    // the not-found message if the role stopped being public after the build.
    document.getElementById('sc-static')?.remove();
    if (!c && roleKey === TASTER_ROLE) {
      // Not public yet (Beta/Hidden for this visitor): the free check alone, as the page.
      document.title = 'Free Website Check | Be More Swan';
      const root = document.getElementById('sc-root');
      root.innerHTML = '<div id="site-taster-host"></div>';
      root.classList.remove('hidden');
      mountTaster(root, roleKey, { name: 'Mystery Shopper', comingSoon: false }, 'h1');
      return;
    }
    if (!c) { document.getElementById('sc-error').classList.remove('hidden'); return; }

    // A generated page already carries its own title and description; only the shell sets them.
    if (!bakedRole) {
      document.title = `${c.name} | Be More Swan`;
      const desc = (sc && sc.headline) || c.tagline || c.description || '';
      document.querySelector('meta[name="description"]')?.setAttribute('content', desc);
    }
    const root = document.getElementById('sc-root');
    root.innerHTML = render(roleKey, c, sc);
    root.classList.remove('hidden');
    mountTaster(root, roleKey, c, 'h2');
    // A result link from the email scrolls past the hero to the check.
    if (roleKey === TASTER_ROLE && new URLSearchParams(location.search).get('r')) {
      document.getElementById('free-website-check')?.scrollIntoView({ block: 'start' });
    }

    // A video file that isn't there yet (not rendered/deployed) must not leave a black box.
    root.querySelector('#sc-video video source')?.addEventListener('error', () => {
      const box = document.getElementById('sc-video');
      if (box) { box.parentElement.style.display = 'none'; }
      root.querySelectorAll('a[href="#sc-video"]').forEach((a) => a.remove());
    });

    root.addEventListener('click', (e) => {
      const hire = e.target.closest('[data-hire]');
      if (hire) { try { sessionStorage.setItem('intended_role', hire.dataset.hire); } catch (er) { /* fine */ } return; }
      const intent = e.target.closest('[data-intent]');
      if (intent) { try { localStorage.setItem('bms_intended_role', intent.dataset.intent); } catch (er) { /* fine */ } return; }
      const img = e.target.closest('[data-zoom]');
      if (img) {
        const box = document.getElementById('sc-lightbox');
        box.querySelector('img').src = img.src;
        box.querySelector('img').alt = img.alt;
        box.classList.add('is-open');
        box.focus();
      }
    });
    const box = document.getElementById('sc-lightbox');
    box.addEventListener('click', () => box.classList.remove('is-open'));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') box.classList.remove('is-open'); });
  });
})();
</script>
</body>
</html>
