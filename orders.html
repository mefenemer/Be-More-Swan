  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
    <div>
      <h1 class="text-3xl font-extrabold text-gray-900">Orders</h1>

    <a href="https://dashboard.stripe.com/payments" target="_blank" rel="noopener" class="btn-secondary border px-4 py-2 text-sm font-bold rounded-lg">Open Stripe</a>
